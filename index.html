<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>잘나가GYM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo',sans-serif;background:#f5f0e8;color:#2d2418;font-size:13px}
:root{--accent:#f5a800;--accent2:#e07800;--gold:#f5a800;--green:#2e7d32;--green-light:#e8f5e9;--danger:#b71c1c;--danger-light:#fff0f0;--info:#1565c0;--info-light:#e3f2fd;--warn:#e65100;--text:#2d2418;--text2:#6b5f45;--text3:#9e8f70;--surface:#fffdf7;--surface2:#f0ebe0;--border:#e0d0b8;--border2:#c8b89a;--radius:10px;}
.nav{background:#1a1710;padding:0 16px;display:flex;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.nav-brand{color:var(--gold);font-weight:800;font-size:16px;padding:14px 16px 14px 0;white-space:nowrap}
.nav-tabs{display:flex;overflow-x:auto;flex:1}
.tab{background:none;border:none;color:#aaa;padding:14px 12px;cursor:pointer;font-size:12px;white-space:nowrap;border-bottom:3px solid transparent;transition:.2s}
.tab.active{color:#fff;border-bottom-color:var(--gold)}
.tab:hover:not(.active){color:#ddd}
.nav-right{display:flex;align-items:center;gap:8px;margin-left:auto;padding-left:12px}
.nav-user{color:#ccc;font-size:11px;white-space:nowrap}
.main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.section-title{font-size:16px;font-weight:700}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;border-top:3px solid var(--accent)}
.metric-label{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.metric-value{font-size:18px;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border:1.5px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer;font-size:13px;font-family:inherit;transition:.15s}
.btn:hover{background:var(--surface2)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:var(--accent2)}
.btn-primary:hover{opacity:.9}
.btn-danger{background:#fde8e8;color:var(--danger);border-color:#f5b4b4}
.btn-success{background:var(--green-light);color:var(--green);border-color:#a5d6a7}
.btn-edit{background:#e3f2fd;color:var(--info);border-color:#90caf9}
.btn-sm{padding:4px 10px;font-size:11px}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{background:var(--surface2);padding:8px;text-align:left;font-weight:700;color:var(--text2);border-bottom:2px solid var(--border);white-space:nowrap}
.data-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tr:hover td{background:#fffbf3}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1.5px solid var(--border2);border-radius:6px;font-size:13px;font-family:inherit;background:#fff;color:var(--text)}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fg4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.iform{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.iform-title{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--accent2)}
.hidden{display:none!important}
.vat-hint{font-size:10px;color:var(--text3);margin-top:3px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.badge-blue{background:#dbeafe;color:#1e40af}.badge-green{background:#dcfce7;color:#166534}
.badge-amber{background:#fef3c7;color:#92400e}.badge-red{background:#fee2e2;color:#991b1b}.badge-gray{background:#f3f4f6;color:#374151}
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-tab{padding:5px 14px;border:1.5px solid var(--border2);border-radius:99px;background:var(--surface);cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.filter-tab.active{background:var(--accent);color:#fff;border-color:var(--accent2)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1710,#2d2418)}
.login-box{background:#fff;border-radius:16px;padding:36px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{text-align:center;font-size:28px;font-weight:900;color:var(--accent2);margin-bottom:8px}
.login-sub{text-align:center;color:#888;font-size:12px;margin-bottom:28px}
.msearch-wrap{position:relative}
.msearch-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--border2);border-radius:6px;z-index:200;max-height:180px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.msearch-item{padding:8px 12px;cursor:pointer;font-size:13px}
.msearch-item:hover{background:var(--surface2)}
.locker-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.locker-cell{aspect-ratio:1;border:1.5px solid var(--border);border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;transition:.15s;background:var(--surface)}
.locker-cell.used{background:#fff3cd;border-color:#f5a800}.locker-cell.empty{background:#e8f5e9;border-color:#66bb6a}
.locker-cell:hover{transform:scale(1.05)}
.empty{text-align:center;color:var(--text3);padding:30px;font-size:14px}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
const S={members:[],packages:[],sessions:[],trainers:[],lockers:{},accounts:{},actLog:[],deletedLog:[]};
let CU=null,CT='',selectedMember=null;
let salesView='monthly',salesMonth='',salesDate='';
let ptFilter='all',sessMonth='';
let payMode='monthly',payMonth='',payRangeFrom='',payRangeTo='',payTrainerFilter='all',expandedTrainer='';
let unpaidView='all',unpaidMonth='',unpaidDate='',unpaidYear='';

var GAS_URL='https://script.google.com/macros/s/AKfycbzibGXgQXR_AqojSPS0GjiToWCq7-Zx5BNbWqk_8b8gNKX5IW1dIN4GBrv4R2HVlGim/exec';
var _saving=false;

function LS(k,d){if(d===undefined)d='[]';try{var v=localStorage.getItem(k);return JSON.parse(v!==null?v:d);}catch(e){try{return JSON.parse(d);}catch(e2){return [];}}}
function SS(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

function loadState(){
  S.members=LS('jng_members');S.packages=LS('jng_packages');S.sessions=LS('jng_sessions');
  S.trainers=LS('jng_trainers');S.lockers=LS('jng_lockers','{}');
  S.actLog=LS('jng_actlog');S.deletedLog=LS('jng_deletedlog');
  S.bonuses=LS('jng_bonuses','{}');
  var acc=LS('jng_accounts','null');
  if(acc&&typeof acc==='object'&&!Array.isArray(acc)&&Object.keys(acc).length>0)S.accounts=acc;
  else S.accounts={admin:{id:'admin',pw:'1234',role:'admin',name:'관리자',trainerId:''}};
}

// 구글시트에서 최신 데이터 가져오기
function syncFromCloud(callback){
  showSyncBanner('☁️ 데이터 불러오는 중...');
  fetch(GAS_URL)
  .then(function(r){return r.json();})
  .then(function(res){
    if(res.ok&&res.data&&res.data.length>2){
      try{
        var d=JSON.parse(res.data);
        if(d.members)S.members=d.members;
        if(d.packages)S.packages=d.packages;
        if(d.sessions)S.sessions=d.sessions;
        if(d.trainers)S.trainers=d.trainers;
        if(d.lockers)S.lockers=d.lockers;
        if(d.accounts)S.accounts=d.accounts;
        if(d.deletedLog)S.deletedLog=d.deletedLog;
        SS('jng_members',S.members);SS('jng_packages',S.packages);
        SS('jng_sessions',S.sessions);SS('jng_trainers',S.trainers);
        SS('jng_lockers',S.lockers);SS('jng_accounts',S.accounts);
        SS('jng_deletedlog',S.deletedLog);
        hideSyncBanner();
        if(callback)callback(true);
      }catch(e){hideSyncBanner();if(callback)callback(false);}
    }else{
      hideSyncBanner();if(callback)callback(false);
    }
  })
  .catch(function(){hideSyncBanner();if(callback)callback(false);});
}

// 구글시트에 저장
function saveState(){
  SS('jng_members',S.members);SS('jng_packages',S.packages);SS('jng_sessions',S.sessions);
  SS('jng_trainers',S.trainers);SS('jng_lockers',S.lockers);SS('jng_accounts',S.accounts);
  SS('jng_actlog',S.actLog);SS('jng_deletedlog',S.deletedLog);SS('jng_bonuses',S.bonuses||{});
  if(_saving)return;_saving=true;
  showSyncBanner('💾 저장 중...');
  var payload=JSON.stringify({
    members:S.members,packages:S.packages,sessions:S.sessions,
    trainers:S.trainers,lockers:S.lockers,accounts:S.accounts,
    deletedLog:S.deletedLog||[]
  });
  fetch(GAS_URL,{method:'POST',body:JSON.stringify({data:payload})})
  .then(function(r){return r.json();})
  .then(function(res){
    _saving=false;
    if(res.ok)showSyncBanner('✅ 저장 완료!',1500);
    else showSyncBanner('⚠️ 저장 실패',2000);
  })
  .catch(function(){
    _saving=false;
    showSyncBanner('⚠️ 네트워크 오류 (로컬 저장됨)',2000);
  });
}

function showSyncBanner(msg,autoHideMs){
  var b=document.getElementById('sync-banner');
  if(!b){
    b=document.createElement('div');b.id='sync-banner';
    b.style.cssText='position:fixed;bottom:24px;right:24px;background:#1a1710;color:#fff;padding:16px 28px;border-radius:12px;font-size:17px;font-weight:700;z-index:99999;box-shadow:0 8px 28px rgba(0,0,0,.5);transition:.3s;min-width:200px;text-align:center;letter-spacing:0.3px';
    document.body.appendChild(b);
  }
  b.textContent=msg;b.style.opacity='1';
  if(autoHideMs)setTimeout(hideSyncBanner,autoHideMs);
}
function hideSyncBanner(){
  var b=document.getElementById('sync-banner');
  if(b)b.style.opacity='0';
}
function logAct(a){S.actLog.push({ts:new Date().toISOString(),userId:CU?CU.id:'',action:a});if(S.actLog.length>500)S.actLog=S.actLog.slice(-500);}

// AUTH
function doLogin(){
  var id=document.getElementById('login-id').value.trim();
  var pw=document.getElementById('login-pw').value;
  var acc=Object.values(S.accounts).find(function(a){return a.id===id&&a.pw===pw;});
  if(!acc){alert('아이디 또는 비밀번호가 틀렸어요');return;}
  CU=acc;SS('jng_session',{id:acc.id,ts:Date.now()});
  logAct('로그인:'+id);saveState();initApp();
}
function doLogout(){SS('jng_session',null);CU=null;selectedMember=null;document.getElementById('app').innerHTML=renderLogin();}
function renderLogin(){
  return '<div class="login-wrap"><div class="login-box">'+
  '<div class="login-logo">&#128170; 잘나가GYM</div>'+
  '<div class="login-sub">PT샵 관리 시스템</div>'+
  '<div class="field"><label>아이디</label><input id="login-id" placeholder="아이디" onkeydown="if(event.key===\'Enter\')doLogin()"></div>'+
  '<div class="field"><label>비밀번호</label><input id="login-pw" type="password" placeholder="비밀번호" onkeydown="if(event.key===\'Enter\')doLogin()"></div>'+
  '<button class="btn btn-primary" style="width:100%;padding:12px;font-size:15px" onclick="doLogin()">로그인</button>'+
  '</div></div>';
}

// NAV
var TABS_ADMIN=[{id:'members',label:'회원 관리'},{id:'lockers',label:'락카 관리'},{id:'packages',label:'매출현황'},{id:'unpaid',label:'💰 미수금'},{id:'sessions',label:'수업 기록'},{id:'payroll',label:'급여 정산'},{id:'settings',label:'설정'}];
var TABS_STAFF=[{id:'members',label:'회원 관리'},{id:'lockers',label:'락카 현황'},{id:'packages',label:'매출현황'},{id:'unpaid',label:'💰 미수금'},{id:'sessions',label:'내 수업 기록'},{id:'payroll',label:'내 급여'}];
function buildNav(){
  var tabs=CU.role==='admin'?TABS_ADMIN:TABS_STAFF;
  document.getElementById('nav-tabs').innerHTML=tabs.map(function(t){return '<button class="tab" id="nav-'+t.id+'" onclick="switchTab(\''+t.id+'\')">'+t.label+'</button>';}).join('');
}
function switchTab(t){
  CT=t;
  var tabs=CU.role==='admin'?TABS_ADMIN:TABS_STAFF;
  tabs.forEach(function(x){var el=document.getElementById('nav-'+x.id);if(el)el.classList.toggle('active',x.id===t);});
  var mc=document.getElementById('main-content');
  try{
    if(t==='members')mc.innerHTML=renderMembers();
    else if(t==='lockers')mc.innerHTML=renderLockers();
    else if(t==='packages')mc.innerHTML=renderPackages();
    else if(t==='unpaid')mc.innerHTML=renderUnpaid();
    else if(t==='sessions')mc.innerHTML=renderSessions();
    else if(t==='payroll')mc.innerHTML=renderPayroll();
    else if(t==='settings')mc.innerHTML=renderSettings();
  }catch(e){mc.innerHTML='<div class="card"><div class="empty">오류: '+e.message+'</div></div>';}
}
function refreshSales(){if(CT==='packages')switchTab('packages');}
function initApp(){
  var now=new Date();
  salesMonth=now.getFullYear()+'-'+(now.getMonth()+1).toString().padStart(2,'0');
  salesDate=today();sessMonth=salesMonth;
  payMonth=salesMonth;payRangeFrom=salesMonth;payRangeTo=salesMonth;
  unpaidMonth=salesMonth;unpaidYear=String(now.getFullYear());unpaidDate=today();
  document.getElementById('app').innerHTML=
  '<nav class="nav"><div class="nav-brand">&#128170; 잘나가GYM</div>'+
  '<div class="nav-tabs" id="nav-tabs"></div>'+
  '<div class="nav-right"><span class="nav-user">'+CU.name+'('+(CU.role==='admin'?'관리자':'직원')+')</span>'+
  '<button class="btn btn-sm" onclick="doLogout()">로그아웃</button></div></nav>'+
  '<div class="main"><div id="main-content"></div></div>';
  buildNav();switchTab('members');
}

// HELPERS
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');}
function fmt(n){return Number(n||0).toLocaleString('ko-KR');}
function mname(id){var m=S.members.find(function(x){return x.id==id;});return m?m.name:'?';}
function tname(id){var t=S.trainers.find(function(x){return x.id==id;});return t?t.name:'-';}
function exVat(p){return Math.round(p/1.1);}
function allMonths(){var res=[],d=new Date();for(var i=0;i<48;i++){res.push(d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0'));d.setMonth(d.getMonth()-1);}return res;}
function getMemberBalance(memberId){
  // 미할당 세션 먼저 자동 할당
  assignSessionsToPkgs(memberId);
  // 환불된 상품의 packageId 목록
  var refundedPkgIds=S.packages.filter(function(p){return p.memberId==memberId&&!p.isRefund&&p.refunded;}).map(function(p){return p.id;});
  // 환불된 상품의 add세션 제외
  var added=S.sessions.filter(function(s){
    return s.memberId==memberId&&s.type==='add'&&refundedPkgIds.indexOf(s.packageId)<0;
  }).reduce(function(s,x){return s+Number(x.qty||1);},0);
  // 환불된 상품의 use세션 제외
  var used=S.sessions.filter(function(s){
    return s.memberId==memberId&&s.type==='use'&&refundedPkgIds.indexOf(s.packageId)<0;
  }).reduce(function(s,x){return s+Number(x.qty||1);},0);
  return added-used;
}
function getMemberDefaultTrainer(memberId){
  var m=S.members.find(function(x){return x.id==memberId;});
  if(m&&m.defaultTrainerId)return m.defaultTrainerId;
  var p=S.packages.filter(function(x){return x.memberId==memberId&&!x.isRefund;}).sort(function(a,b){return b.startDate.localeCompare(a.startDate);})[0];
  return p?p.trainerId:'';
}
function getMemberUnpaid(memberId){return S.packages.filter(function(p){return p.memberId==memberId&&!p.isRefund;}).reduce(function(s,p){return s+calcRemainingUnpaid(p);},0);}
function calcRemainingUnpaid(p){return Math.max(0,Number(p.unpaidAmount||0));}
function calcUnpaidCollected(p){return (p.unpaidCollections||[]).reduce(function(s,c){return s+Number(c.amount||0);},0);}
function getExVatPrice(price,payType){return payType==='cash'?price:Math.round(price/1.1);}
function calcEndDate(startDate,total){
  if(!startDate||!total)return '';
  var d=new Date(startDate);d.setDate(d.getDate()+Math.ceil(total/10)*30);
  return d.toISOString().split('T')[0];
}
var REG_PCT={new:45,re:55,intro:55};
var REG_LABEL={'new':'신규',re:'재등록',intro:'소개'};
var REG_BADGE={'new':'badge-blue',re:'badge-green',intro:'badge-amber'};
var PAY_LABEL={card:'카드',cash:'현금',cashreceipt:'현금영수증',refund:'환불'};
function showIForm(id){var el=document.getElementById(id);if(el)el.classList.remove('hidden');}
function hideIForm(id){var el=document.getElementById(id);if(el)el.classList.add('hidden');}
function toggleDetailForm(id){var el=document.getElementById(id);if(el)el.classList.toggle('hidden');}
function hideDetailForm(id){var el=document.getElementById(id);if(el)el.classList.add('hidden');}
function vatPreview(priceId,vatId){
  var el=document.getElementById(priceId),price=parseNum(el?el.value:''),vat=Math.round(price/11),vel=document.getElementById(vatId);
  if(vel)vel.textContent=price>0?'부가세 '+fmt(vat)+'원 / VAT제외 '+fmt(price-vat)+'원':'';
}
// 콤마 입력 헬퍼
function numInput(el){
  var v=el.value.replace(/[^0-9]/g,'');
  var num=parseInt(v)||0;
  el.value=num>0?num.toLocaleString('ko-KR'):'';
  el.dataset.num=num;
}
function parseNum(v){
  if(typeof v==='string')return parseInt(v.replace(/[^0-9]/g,''))||0;
  return parseInt(v)||0;
}
function msHtml(inputId,hiddenId,ph){
  ph=ph||'회원 검색...';
  return '<div class="msearch-wrap" id="mswrap-'+hiddenId+'">'+
  '<input type="text" id="'+inputId+'" placeholder="'+ph+'" autocomplete="off" '+
  'oninput="msSearch(\''+inputId+'\',\''+hiddenId+'\')" onfocus="msSearch(\''+inputId+'\',\''+hiddenId+'\')">'+
  '<input type="hidden" id="'+hiddenId+'">'+
  '<div id="msdrop-'+hiddenId+'" class="msearch-dropdown hidden"></div></div>';
}
function msSearch(inputId,hiddenId){
  var q=(document.getElementById(inputId).value||'').toLowerCase();
  var drop=document.getElementById('msdrop-'+hiddenId);if(!drop)return;
  var matches=S.members.filter(function(m){return m.name.toLowerCase().includes(q)||(m.phone&&m.phone.includes(q));});
  if(!matches.length){drop.classList.add('hidden');return;}
  drop.classList.remove('hidden');
  drop.innerHTML=matches.slice(0,10).map(function(m){return '<div class="msearch-item" onclick="msPick(\''+m.id+'\',\''+inputId+'\',\''+hiddenId+'\')">'+m.name+(m.phone?' ('+m.phone+')':'')+'</div>';}).join('');
}
function msPick(mid,inputId,hiddenId){
  var m=S.members.find(function(x){return x.id===mid;});if(!m)return;
  document.getElementById(inputId).value=m.name;document.getElementById(hiddenId).value=mid;
  var drop=document.getElementById('msdrop-'+hiddenId);if(drop)drop.classList.add('hidden');
}
function goToMember(mid){
  selectedMember=S.members.find(function(m){return m.id===mid;})||null;
  if(!selectedMember){alert('회원 정보를 찾을 수 없어요');return;}
  switchTab('members');
}

// ── MEMBERS ──
function isExpired(m){
  var latestPkg=S.packages.filter(function(p){return p.memberId==m.id&&!p.isRefund;}).sort(function(a,b){return b.startDate.localeCompare(a.startDate);})[0];
  var endDate=m.endDate||(latestPkg?calcEndDate(latestPkg.startDate,latestPkg.totalSessions):'');
  if(m.manualExpired)return true;
  return !!(endDate&&endDate<today());
}
function memberRow(m){
  var bal=getMemberBalance(m.id);
  var unpaid=getMemberUnpaid(m.id);

function memberFilterList(){
  var q=(window._memberSearchQ||'').toLowerCase();

  function filterMember(m){
    if(q&&!m.name.toLowerCase().includes(q)&&!(m.phone&&m.phone.includes(q)))return false;
    if(tFilter){var lp=S.packages.filter(function(p){return p.memberId==m.id&&!p.isRefund;}).sort(function(a,b){return b.startDate.localeCompare(a.startDate);})[0];if(getMemberDefaultTrainer(m.id)!==tFilter)return false;}
    return true;
  }
  var activeMembers=S.members.filter(function(m){return !isExpired(m)&&filterMember(m);});
  var expiredMembers=S.members.filter(function(m){return isExpired(m)&&filterMember(m);});

function calcDetailPaid(mid){
  var qty=parseInt(document.getElementById('dpkg-qty-'+mid)?document.getElementById('dpkg-qty-'+mid).value:0)||0;
  var price=parseNum(document.getElementById('dpkg-price-'+mid)?document.getElementById('dpkg-price-'+mid).value:'');
  var total=qty*price;
  var paid=document.getElementById('dpkg-paid-'+mid);
  if(paid&&!paid.dataset.manual){paid.value=total>0?total.toLocaleString('ko-KR'):'';paid.dataset.num=total;}
  var unpaid=document.getElementById('dpkg-unpaid-'+mid);
  if(unpaid){unpaid.value='0';unpaid.dataset.num=0;}
}
function calcDetailUnpaid(mid){
  var qty=parseInt(document.getElementById('dpkg-qty-'+mid)?document.getElementById('dpkg-qty-'+mid).value:0)||0;
  var price=parseNum(document.getElementById('dpkg-price-'+mid)?document.getElementById('dpkg-price-'+mid).value:'');
  var total=qty*price;
  var paid=parseNum(document.getElementById('dpkg-paid-'+mid)?document.getElementById('dpkg-paid-'+mid).value:'');
  var unpaidVal=Math.max(0,total-paid);
  var unpaid=document.getElementById('dpkg-unpaid-'+mid);
  if(unpaid){unpaid.value=unpaidVal>0?unpaidVal.toLocaleString('ko-KR'):'0';unpaid.dataset.num=unpaidVal;}
}

// 특정 상품의 잔여 횟수
function getPkgBalance(pkgId, totalSessions){
  // packageId 있는 use 세션으로 차감
  var usedWithPkg=S.sessions.filter(function(s){return s.type==='use'&&s.packageId===pkgId;}).reduce(function(s,x){return s+Number(x.qty||1);},0);
  return Math.max(0, totalSessions-usedWithPkg);
}

// packageId 없는 세션을 오래된 상품부터 순서대로 할당
function assignSessionsToPkgs(memberId){
  var pkgs=S.packages.filter(function(p){return p.memberId==memberId&&!p.isRefund&&!p.refunded&&p.totalSessions>0;})
    .sort(function(a,b){return a.startDate.localeCompare(b.startDate);});
  var unassigned=S.sessions.filter(function(s){return s.memberId==memberId&&s.type==='use'&&!s.packageId;})
    .sort(function(a,b){return a.date.localeCompare(b.date);});
  if(!unassigned.length)return;
  // 각 상품의 남은 용량 계산 (이미 할당된 것 기준)
  var pkgRemain={};
  pkgs.forEach(function(p){
    var used=S.sessions.filter(function(s){return s.type==='use'&&s.packageId===p.id;}).reduce(function(s,x){return s+Number(x.qty||1);},0);
    pkgRemain[p.id]=Math.max(0,p.totalSessions-used);
  });
  // 미할당 세션을 오래된 상품부터 채움
  unassigned.forEach(function(sess){
    var qty=Number(sess.qty||1);
    for(var i=0;i<pkgs.length;i++){
      var p=pkgs[i];
      if(pkgRemain[p.id]>0){
        if(pkgRemain[p.id]>=qty){
          sess.packageId=p.id;
          pkgRemain[p.id]-=qty;
          break;
        } else {
          // 이 상품으로 부분 할당 (남은 용량이 있으면)
          sess.packageId=p.id;
          pkgRemain[p.id]=0;
          break;
        }
      }
    }
  });
}

// 가장 오래된 유효 상품 (등록일 오름차순, 잔여 있는 것)
function getOldestActivePkg(mid){
  // 먼저 미할당 세션 자동 할당
  assignSessionsToPkgs(mid);
  return S.packages.filter(function(p){
    return p.memberId==mid&&!p.isRefund&&!p.refunded&&p.totalSessions>0;
  }).sort(function(a,b){return a.startDate.localeCompare(b.startDate);})
  .find(function(p){return getPkgBalance(p.id,p.totalSessions)>0;});
}
function saveDetailUse(mid){
  try{
    var trainerEl=document.getElementById('duse-trainer-'+mid);
    var monthEl=document.getElementById('duse-month-'+mid);
    var qtyEl=document.getElementById('duse-qty-'+mid);
    if(!trainerEl||!monthEl||!qtyEl){alert('입력 폼을 찾을 수 없어요');return;}
    var trainerId=trainerEl.value;var month=monthEl.value;var qty=parseInt(qtyEl.value)||0;
    if(!trainerId){alert('트레이너를 선택해주세요');return;}
    if(!qty||qty<1){alert('횟수를 입력해주세요');return;}
    // 가장 먼저 등록한 유효 상품 찾기
    var activePkg=getOldestActivePkg(mid);
    if(!activePkg){alert('⚠️ 사용 가능한 횟수권이 없어요!\n\n모든 상품의 횟수가 소진됐거나 환불됐어요.');return;}
    var remaining=getPkgBalance(activePkg.id,activePkg.totalSessions);
    if(remaining<qty){
      alert('⚠️ 현재 상품 잔여 횟수 부족!\n\n상품: '+activePkg.startDate+' 등록 ('+activePkg.totalSessions+'회)\n잔여: '+remaining+'회\n소진하려는 횟수: '+qty+'회\n\n'+remaining+'회 이하로 입력해주세요.');
      return;

function deletePkgFromMember(pkgId,mid){
  var p=S.packages.find(function(x){return x.id===pkgId;});if(!p)return;
  var label=p.isRefund?'환불':'횟수권';
  if(!confirm('이 '+label+' 내역을 삭제할까요?\n\n'+mname(p.memberId)+' / '+p.startDate+'\n\n삭제 후 복구할 수 없어요.'))return;
  if(!S.deletedLog)S.deletedLog=[];
  S.deletedLog.unshift({ts:new Date().toISOString(),type:label,by:CU?CU.id:'',summary:mname(mid)+' / '+p.startDate,data:JSON.parse(JSON.stringify(p))});
  if(S.deletedLog.length>200)S.deletedLog=S.deletedLog.slice(0,200);
  S.packages=S.packages.filter(function(x){return x.id!==pkgId;});
  // 횟수권 삭제 시 연결된 횟수등록(add) 세션도 함께 삭제 → 잔여횟수 반영
  if(!p.isRefund){
    var deleted=false;
    // 1순위: packageId 정확히 매칭
    var before=S.sessions.length;
    S.sessions=S.sessions.filter(function(s){
      return !(s.memberId==mid&&s.type==='add'&&s.packageId===pkgId);
    });
    if(S.sessions.length<before){deleted=true;}
    // 2순위: packageId 없고 qty+date 매칭
    if(!deleted){
      before=S.sessions.length;
      S.sessions=S.sessions.filter(function(s){
        return !(s.memberId==mid&&s.type==='add'&&!s.packageId&&Number(s.qty||1)===p.totalSessions&&s.date===p.startDate);
      });
      if(S.sessions.length<before){deleted=true;}
    }
    // 3순위: packageId 없고 qty만 매칭 (날짜 무관, 가장 최근 것 1개만)
    if(!deleted){
      var found=false;
      S.sessions=S.sessions.filter(function(s){
        if(found)return true;
        if(s.memberId==mid&&s.type==='add'&&!s.packageId&&Number(s.qty||1)===p.totalSessions){
          found=true;return false;
        }
        return true;
      });
    }
  }
  saveState();logAct('결제삭제:'+mname(mid));selectedMember=S.members.find(function(x){return x.id===mid;});switchTab('members');
}

function renderLockers(){
  var used=Object.values(S.lockers).filter(function(v){return v&&v.name;}).length;

  // 6행×10열, 오른쪽 열부터 1번
  var ORDER=[];
  for(var row=0;row<6;row++){
    for(var col=0;col<10;col++){
      ORDER.push((9-col)*6+row+1);
    }
  }

  var cells=ORDER.map(function(n){
    var data=S.lockers[n]||{};
    var occ=!!(data.name);
    return '<div class="locker-cell '+(occ?'used':'empty')+'" id="lkcell-'+n+'" onclick="selLocker('+n+')" style="min-height:70px;padding:5px;justify-content:space-between">'+
    '<div style="font-size:13px;font-weight:800;color:'+(occ?'var(--accent2)':'var(--text3)')+'">'+n+'</div>'+
    (occ
      ?'<div style="font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;text-align:center">'+data.name+'</div>'+
       '<div style="font-size:11px;color:var(--text2);letter-spacing:3px;font-weight:700">'+(data.pw||'')+'</div>'
      :'<div style="font-size:11px;color:var(--text3);text-align:center">빈칸</div><div></div>'
    )+'</div>';
  }).join('');

  return '<div class="section-header">'+
  '<div class="section-title">락카 관리</div>'+
  '<span style="font-size:13px;color:var(--text2)">사용중 <strong>'+used+'</strong>/60</span>'+

  '<div class="card" style="margin-bottom:12px;padding:12px">'+

  'style="width:100%;padding:10px 14px;border:1.5px solid var(--border2);border-radius:8px;font-size:14px;font-family:inherit">'+

  '</div>'+
  '<div style="display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-bottom:16px">'+cells+'</div>';
}
function lkSearch(q){
  var el=document.getElementById('lk-search-result');
  if(!el)return;
  q=(q||'').trim().toLowerCase();
  if(!q){el.innerHTML='';return;}
  var results=[];
  Object.keys(S.lockers).forEach(function(n){
    var data=S.lockers[n]||{};
    if(!data.name)return;
    var matchName=data.name.toLowerCase().includes(q);
    var matchNum=String(n).includes(q);
    if(matchName||matchNum)results.push({n:n,data:data});
  });
  if(!results.length){
    el.innerHTML='<div style="color:var(--text3);font-size:13px;padding:8px 0">검색 결과 없음</div>';
    return;
  }
  el.innerHTML='<div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px">검색 결과 '+results.length+'건</div>'+
  results.map(function(r){
    return '<div onclick="selLocker('+r.n+')" style="display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;margin-bottom:6px;background:#fff;transition:.15s" '+
    'onmouseover="this.style.background=\'#fffbf0\';this.style.borderColor=\'var(--accent)\'" '+
    'onmouseout="this.style.background=\'#fff\';this.style.borderColor=\'var(--border)\'">'+
    '<div style="width:40px;height:40px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">'+r.n+'</div>'+
    '<div style="flex:1">'+
    '<div style="font-weight:700;font-size:14px">'+r.data.name+'</div>'+

function lkSave(n){
  var nameInp=document.getElementById('lk-name-inp');
  var pwInp=document.getElementById('lk-pw-inp');
  var name=nameInp?nameInp.value.trim():'';
  var pw=pwInp?pwInp.value.trim():'';
  var memberId=document.getElementById('lk-member-id')?document.getElementById('lk-member-id').value:'';
  if(!name){alert('이름을 입력해주세요');return;}
  // 기존 이 락카를 쓰던 회원이 있으면 락카 정보 제거
  Object.keys(S.lockers).forEach(function(k){
    if(S.lockers[k]&&S.lockers[k].memberId){
      if(S.lockers[k].memberId===memberId&&Number(k)!==Number(n)){
        // 같은 회원이 다른 락카에 있으면 기존 락카 비우기
        delete S.lockers[k];
      }
    }
  });
  S.lockers[n]={name:name,pw:pw,memberId:memberId};
  // 회원관리에도 락카 정보 기록
  if(memberId){
    var m=S.members.find(function(x){return x.id===memberId;});
    if(m){m.lockerNum=n;m.lockerPw=pw;}
  }
  saveState();logAct('락카저장:'+n+'번 '+name);
  var ol=document.getElementById('lk-overlay');if(ol)document.body.removeChild(ol);
  switchTab('lockers');
}
function lkClear(n){
  if(!confirm(n+'번 락카를 비울까요?'))return;
  // 연결된 회원의 락카 정보도 제거
  var data=S.lockers[n]||{};
  if(data.memberId){
    var m=S.members.find(function(x){return x.id===data.memberId;});
    if(m){delete m.lockerNum;delete m.lockerPw;}
  }
  delete S.lockers[n];
  saveState();logAct('락카비우기:'+n+'번');
  var ol=document.getElementById('lk-overlay');if(ol)document.body.removeChild(ol);
  switchTab('lockers');
}
function saveLocker(){

function clearLocker(){

}

function getPkgs(){
  var list=S.packages;
  if(ptFilter==='refund')list=list.filter(function(p){return p.isRefund;});
  else if(ptFilter!=='all')list=list.filter(function(p){return !p.isRefund&&p.payType===ptFilter;});
  if(salesView==='monthly')list=list.filter(function(p){return p.startDate.startsWith(salesMonth);});
  else if(salesView==='daily')list=list.filter(function(p){return p.startDate===salesDate;});
  else if(salesView==='yearly'){
    var y=document.getElementById('sales-year')?document.getElementById('sales-year').value:new Date().getFullYear().toString();
    list=list.filter(function(p){return p.startDate.startsWith(y);});
  }
  return list;
}
function inViewDate(d){
  if(!d)return false;
  if(salesView==='monthly')return d.startsWith(salesMonth);
  if(salesView==='daily')return d===salesDate;
  if(salesView==='yearly'){var y=document.getElementById('sales-year')?document.getElementById('sales-year').value:new Date().getFullYear().toString();return d.startsWith(y);}
  return true;
}

function buildSalesSummary(){
  var savedFilter=ptFilter;ptFilter='all';
  var allPkgs=S.packages.filter(function(p){return !p.isRefund&&inViewDate(p.startDate);});
  var allRefunds=S.packages.filter(function(p){return p.isRefund&&inViewDate(p.startDate||p.refundDate);});
  ptFilter=savedFilter;
  // 이번 기간 수금 - 등록일 무관, 수금일 기준으로만 집계
  var collInView=[];
  S.packages.filter(function(p){return !p.isRefund&&p.unpaidCollections&&p.unpaidCollections.length;}).forEach(function(p){
    (p.unpaidCollections||[]).forEach(function(c){
      if(inViewDate(c.date))collInView.push({p:p,c:c,sameReg:inViewDate(p.startDate)});
    });
  });
  // 등록 매출: originalPaid(최초입금액)만 사용 - 수금액 제외
  // 등록월 매출 = 최초입금액(originalPaid)만 사용 - 수금액 제외
  var regRev=allPkgs.reduce(function(s,p){
    // originalPaid 있으면 사용, 없으면 수금이력 없을때만 paidAmount 사용
    var orig=p.originalPaid!==undefined?Number(p.originalPaid):
      (p.unpaidCollections&&p.unpaidCollections.length>0?
        Number(p.paidAmount)-calcUnpaidCollected(p): // 수금액 제외
        Number(p.paidAmount));
    return s+(orig||0);
  },0);
  // 수금 매출: 수금일이 이번 기간인 것만 (등록월 관계없이)
  var collRev=collInView.reduce(function(s,x){return s+Number(x.c.amount||0);},0);
  var totalRev=regRev+collRev;
  var totalVat=allPkgs.reduce(function(s,p){
    if(p.payType==='cash')return s;
    var basePrice=p.pricePerSession*p.totalSessions;
    return s+Math.round(basePrice/11);
  },0);
  var totalExVat=allPkgs.reduce(function(s,p){
    if(p.payType==='cash')return s+p.pricePerSession*p.totalSessions;
    var basePrice=p.pricePerSession*p.totalSessions;
    return s+Math.round(basePrice/1.1);
  },0);
  var totalRefundAmt=allRefunds.reduce(function(s,p){
    return s+Number(p.refundAmount||0);
  },0);
  var totalPenaltyAmt=allRefunds.reduce(function(s,p){return s+Number(p.penaltyAmount||0);},0);
  var totalRefundTotal=totalRefundAmt;
  var totalUnpaid=allPkgs.reduce(function(s,p){return s+calcRemainingUnpaid(p);},0);
  var cardRev=allPkgs.filter(function(p){return p.payType==='card';}).reduce(function(s,p){return s+(Number(p.originalPaid!==undefined?p.originalPaid:p.paidAmount)||0);},0);
  var cashRev=allPkgs.filter(function(p){return p.payType==='cash';}).reduce(function(s,p){return s+(Number(p.originalPaid!==undefined?p.originalPaid:p.paidAmount)||0);},0);
  var crRev=allPkgs.filter(function(p){return p.payType==='cashreceipt';}).reduce(function(s,p){return s+(Number(p.originalPaid!==undefined?p.originalPaid:p.paidAmount)||0);},0);
  var netRev=totalRev-totalRefundTotal;
  // 트레이너별 - 같은 달 수금은 paidAmount에 이미 포함됨
  var tm={};
  allPkgs.forEach(function(p){
    var tid=p.trainerId||'';
    if(!tm[tid])tm[tid]={rev:0,cnt:0,refund:0,refundCnt:0,unpaidCnt:0,unpaidAmt:0};
    var rev=p.originalPaid!==undefined?Number(p.originalPaid):
      (p.unpaidCollections&&p.unpaidCollections.length>0?
        Number(p.paidAmount)-calcUnpaidCollected(p):
        Number(p.paidAmount))||0; // 최초입금액만
    tm[tid].rev+=rev;tm[tid].cnt++;
    if(calcRemainingUnpaid(p)>0){tm[tid].unpaidCnt++;tm[tid].unpaidAmt+=calcRemainingUnpaid(p);}
  });
  // 수금일 기준으로 해당 트레이너 매출에 추가 (등록월 관계없이 수금일이 이번기간인 것)
  collInView.forEach(function(x){
    var tid=x.p.trainerId||'';
    if(!tm[tid])tm[tid]={rev:0,cnt:0,refund:0,refundCnt:0,unpaidCnt:0,unpaidAmt:0};
    tm[tid].rev+=Number(x.c.amount||0);
  });
  allRefunds.forEach(function(p){
    var tid=p.trainerId||'';
    if(!tm[tid])tm[tid]={rev:0,cnt:0,refund:0,refundCnt:0,unpaidCnt:0,unpaidAmt:0};
    tm[tid].refund+=Number(p.refundAmount||0);tm[tid].refundCnt++;
  });
  var filterLabel={all:'전체',card:'카드',cash:'현금',cashreceipt:'현금영수증',refund:'환불'};
  var filterRev={all:totalRev,card:cardRev,cash:cashRev,cashreceipt:crRev,refund:0};
  var filterColor={all:'var(--accent2)',card:'var(--info)',cash:'var(--green)',cashreceipt:'var(--text)',refund:'var(--danger)'};
  var curRev=filterRev[ptFilter]!==undefined?filterRev[ptFilter]:totalRev;
  // 단가 기준 VAT 계산
  var curPkgs=ptFilter==='all'?allPkgs:allPkgs.filter(function(p){return p.payType===ptFilter;});
  var curVat=ptFilter==='cash'?0:curPkgs.reduce(function(s,p){return s+Math.round(p.pricePerSession*p.totalSessions/11);},0);
  var curExVat=ptFilter==='cash'?curRev:curPkgs.reduce(function(s,p){return s+Math.round(p.pricePerSession*p.totalSessions/1.1);},0);
  var curLabel=filterLabel[ptFilter]||'전체';
  var trainerCards=S.trainers.map(function(t){
    var td=tm[t.id]||{rev:0,cnt:0,refund:0,refundCnt:0,unpaidCnt:0,unpaidAmt:0};
    var net=td.rev-td.refund;
    // 날짜별 내역 집계
    var dayMap={};
    allPkgs.filter(function(p){return p.trainerId===t.id;}).forEach(function(p){
      var d=p.startDate;
      if(!dayMap[d])dayMap[d]={rev:0,cnt:0,items:[],refunds:[],colls:[]};
      dayMap[d].rev+=Number(p.originalPaid!==undefined?p.originalPaid:p.paidAmount)||0; // 최초입금액만
      dayMap[d].cnt++;
      dayMap[d].items.push(p);
    });
    // 환불 건도 날짜별로 추가
    allRefunds.filter(function(p){return p.trainerId===t.id;}).forEach(function(p){
      var d=p.startDate||p.refundDate;
      if(!dayMap[d])dayMap[d]={rev:0,cnt:0,items:[],refunds:[],colls:[]};
      if(!dayMap[d].refunds)dayMap[d].refunds=[];
      dayMap[d].refunds.push(p);
      dayMap[d].rev-=Number(p.refundAmount||0);
    });
    // 수금은 수금일 기준으로만 표시 (등록월 관계없이)
    collInView.filter(function(x){return x.p.trainerId===t.id;}).forEach(function(x){
      var d=x.c.date;
      if(!dayMap[d])dayMap[d]={rev:0,cnt:0,items:[],refunds:[],colls:[]};
      if(!dayMap[d].colls)dayMap[d].colls=[];
      dayMap[d].rev+=Number(x.c.amount||0);
      dayMap[d].colls.push({p:x.p,c:x.c});
    });
    var days=Object.keys(dayMap).sort().reverse();
    var dayRows=days.map(function(d){
      var dm=dayMap[d];
      var hasRefund=dm.refunds&&dm.refunds.length>0;
      var itemRows=(dm.items||[]).map(function(p){
        var remaining=calcRemainingUnpaid(p);
        var dispPaid=p.originalPaid!==undefined?Number(p.originalPaid):Number(p.paidAmount)||0;
        var coll=calcUnpaidCollected(p);
        return '<tr><td>'+mname(p.memberId)+'</td>'+
        '<td><span class="badge '+REG_BADGE[p.regType||'new']+'">'+REG_LABEL[p.regType||'new']+'</span></td>'+
        '<td><span class="badge badge-gray">'+(PAY_LABEL[p.payType]||'-')+'</span></td>'+
        '<td><strong>'+fmt(dispPaid)+'원</strong>'+
        (coll>0?'<div style="font-size:10px;color:var(--info)">+수금 '+fmt(coll)+'원</div>':'')+
        (remaining>0?'<div style="font-size:10px;color:var(--danger)">미수 '+fmt(remaining)+'원</div>':'')+
        '</td></tr>';
      }).join('');
      var refundRows=(dm.refunds||[]).map(function(p){
        var total=Number(p.refundAmount||0);
        return '<tr style="background:#fff5f5">'+
        '<td>'+mname(p.memberId)+'</td>'+
        '<td><span class="badge badge-red">환불</span></td>'+
        '<td><span style="font-size:10px;color:var(--danger)">위약금 '+fmt(p.penaltyAmount||0)+'원</span></td>'+
        '<td><strong style="color:var(--danger)">-'+fmt(total)+'원</strong>'+
        '<div style="font-size:10px;color:var(--text3)">환불액 '+fmt(p.refundAmount||0)+'원</div>'+
        '</td></tr>';
      }).join('');
      var collRows2=(dm.colls||[]).map(function(x){
        return '<tr style="background:#f0f7ff"><td>'+mname(x.p.memberId)+'</td>'+
        '<td><span style="background:#e3f2fd;color:var(--info);font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px">미수수금</span><div style="font-size:10px;color:var(--text3)">원등록:'+x.p.startDate+'</div></td>'+
        '<td><span class="badge badge-gray">'+(PAY_LABEL[x.c.payType]||'-')+'</span></td>'+
        '<td><strong style="color:var(--info)">'+fmt(x.c.amount)+'원</strong></td></tr>';
      }).join('');

function renderPackageList(){

    }

    (hasUnpaid?'<span style="background:#fde8e8;color:var(--danger);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid #f5b4b4">미수잔여</span>':'')+
    '</div>'+
    (hasColl?'<div style="font-size:10px;color:var(--info);margin-top:2px">+수금 '+fmt(calcUnpaidCollected(p))+'원</div>':'')+
    (hasUnpaid?'<div style="font-size:10px;color:var(--danger)">잔여 '+fmt(remaining)+'원</div>':'')+
    '</td>'+
    '<td>'+(hasUnpaid||hasColl?
    '<div style="display:flex;flex-direction:column;gap:2px">'+
    (hasUnpaid?'<span style="color:var(--danger);font-weight:700">'+fmt(remaining)+'원</span>':'<span style="color:var(--green);font-size:11px;font-weight:700">✓완납</span>')+
    (p.unpaidCollections||[]).map(function(c){var pt2=PAY_LABEL[c.payType]||c.payType||'';return '<span style="font-size:10px;color:var(--info)">📅 '+c.date+' '+fmt(c.amount)+'원 '+pt2+'</span>';}).join('')+
    (hasUnpaid?'<button class="btn btn-sm btn-success" onclick="collectUnpaid(\''+p.id+'\')" style="font-size:10px;padding:2px 6px">수금처리</button>':'')+
    '</div>':'-')+'</td>'+
    '<td>-</td><td style="color:var(--text2)">'+(p.memo||'-')+'</td>'+
    '<td><button class="btn btn-sm" onclick="goToMember(\''+p.memberId+'\')" style="color:var(--info);border-color:#a8c0e8;font-size:11px">회원관리</button></td>'+
    '</tr>';
  }).join('');
  return '<div class="card" style="overflow-x:auto"><table class="data-table">'+
  '<thead><tr><th>일자</th><th>회원</th><th>트레이너</th><th>유형</th><th>횟수</th><th>단가(VAT포함)</th><th>단가(VAT제외)</th><th>부가세</th><th>결제</th><th>입금</th><th>미수</th><th>환불</th><th>메모</th><th></th></tr></thead>'+
  '<tbody>'+collHtml+rows+'</tbody></table></div>';
}

// ── COLLECT UNPAID ──
function collectUnpaid(pkgId){
  var p=S.packages.find(function(x){return x.id===pkgId;});if(!p)return;
  var remaining=calcRemainingUnpaid(p);
  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center';
  overlay.innerHTML='<div style="background:#fff;border-radius:12px;padding:24px;width:360px;box-shadow:0 8px 32px rgba(0,0,0,.2);font-family:inherit">'+
  '<div style="font-size:15px;font-weight:700;margin-bottom:4px">💰 미수금 수금처리</div>'+
  '<div style="font-size:12px;color:#666;margin-bottom:16px">'+mname(p.memberId)+' · 잔여 <strong style="color:#b01a1a">'+fmt(remaining)+'원</strong></div>'+
  '<div style="margin-bottom:10px"><label style="font-size:11px;font-weight:700;color:#6b5f45;display:block;margin-bottom:4px">결제수단</label>'+
  '<select id="collect-paytype" onchange="var cv=this.value;document.getElementById(\'collect-card-d\').style.display=cv===\'card\'?\'block\':\'none\';document.getElementById(\'collect-cr-d\').style.display=cv===\'cashreceipt\'?\'block\':\'none\'" style="width:100%;padding:8px 10px;border:1.5px solid #e0d0b8;border-radius:6px;font-size:14px;font-family:inherit">'+
  '<option value="cash">현금</option><option value="card">카드</option><option value="cashreceipt">현금영수증</option></select></div>'+
  '<div id="collect-card-d" style="display:none;background:#f0f7ff;border-radius:8px;padding:10px;margin-bottom:10px">'+
  '<div class="fg2" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
  '<div><label style="font-size:11px;font-weight:700;color:#6b5f45;display:block;margin-bottom:3px">카드사</label><input id="collect-cardco" placeholder="신한,삼성..." style="width:100%;padding:6px 8px;border:1.5px solid #e0d0b8;border-radius:6px;font-size:13px"></div>'+
  '<div><label style="font-size:11px;font-weight:700;color:#6b5f45;display:block;margin-bottom:3px">카드번호</label><input id="collect-cardno" placeholder="카드번호" style="width:100%;padding:6px 8px;border:1.5px solid #e0d0b8;border-radius:6px;font-size:13px"></div>'+
  '<div style="grid-column:span 2"><label style="font-size:11px;font-weight:700;color:#6b5f45;display:block;margin-bottom:3px">승인번호</label><input id="collect-approvalNo" placeholder="승인번호" style="width:100%;padding:6px 8px;border:1.5px solid #e0d0b8;border-radius:6px;font-size:13px"></div>'+
  '</div></div>'+
  '<div id="collect-cr-d" style="display:none;background:#f0fff4;border-radius:8px;padding:10px;margin-bottom:10px">'+
  '<label style="font-size:11px;font-weight:700;color:#6b5f45;display:block;margin-bottom:3px">현금영수증 번호</label>'+
  '<input id="collect-crno" placeholder="현금영수증 번호" style="width:100%;padding:6px 8px;border:1.5px solid #e0d0b8;border-radius:6px;font-size:13px">'+
  '</div>'+
  '<div style="margin-bottom:10px"><label style="font-size:11px;font-weight:700;color:#6b5f45;display:block;margin-bottom:4px">수금 금액</label>'+
  '<input id="collect-amount" type="number" value="'+remaining+'" style="width:100%;padding:8px 10px;border:1.5px solid #e0d0b8;border-radius:6px;font-size:14px;font-family:inherit"></div>'+
  '<div style="margin-bottom:16px"><label style="font-size:11px;font-weight:700;color:#6b5f45;display:block;margin-bottom:4px">수금 날짜</label>'+
  '<input id="collect-date" type="date" value="'+today()+'" style="width:100%;padding:8px 10px;border:1.5px solid #e0d0b8;border-radius:6px;font-size:14px;font-family:inherit"></div>'+
  '<div style="display:flex;gap:8px;justify-content:flex-end">'+
  '<button id="collect-cancel" style="padding:8px 16px;border:1px solid #e0d0b8;border-radius:6px;background:#fff;cursor:pointer;font-family:inherit;font-size:13px">취소</button>'+
  '<button id="collect-ok" style="padding:8px 20px;border:none;border-radius:6px;background:linear-gradient(135deg,#f5a800,#e07800);color:#fff;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px">수금처리</button>'+
  '</div></div>';
  document.body.appendChild(overlay);
  document.getElementById('collect-cancel').onclick=function(){document.body.removeChild(overlay);};
  overlay.onclick=function(e){if(e.target===overlay)document.body.removeChild(overlay);};
  document.getElementById('collect-ok').onclick=function(){
    var amount=parseInt(document.getElementById('collect-amount').value)||0;
    var dateStr=document.getElementById('collect-date').value;
    var payType=document.getElementById('collect-paytype').value;
    var cardco=document.getElementById('collect-cardco')?document.getElementById('collect-cardco').value:'';
    var cardno=document.getElementById('collect-cardno')?document.getElementById('collect-cardno').value:'';
    var approvalNo=document.getElementById('collect-approvalNo')?document.getElementById('collect-approvalNo').value:'';
    var crno=document.getElementById('collect-crno')?document.getElementById('collect-crno').value:'';
    if(!amount||amount<=0){alert('금액을 입력해주세요');return;}
    if(amount>remaining){alert('잔여 미수금('+fmt(remaining)+'원)보다 많을 수 없어요');return;}
    if(!dateStr){alert('날짜를 선택해주세요');return;}
    document.body.removeChild(overlay);
    if(!p.unpaidCollections)p.unpaidCollections=[];
    // originalPaid 최초 1회만 설정 (절대 변경 안함)
    if(p.originalPaid===undefined||p.originalPaid===null)p.originalPaid=Number(p.paidAmount)||0;
    var rec={date:dateStr,amount:amount,payType:payType};
    if(cardco)rec.cardco=cardco;if(cardno)rec.cardno=cardno;if(approvalNo)rec.approvalNo=approvalNo;if(crno)rec.crno=crno;
    p.unpaidCollections.push(rec);
    // paidAmount만 업데이트 (originalPaid는 절대 변경 안함)
    var totalPrice=p.totalSessions*p.pricePerSession;
    var newPaid=Math.min((p.originalPaid||0)+calcUnpaidCollected(p),totalPrice);
    p.paidAmount=newPaid;
    p.unpaidAmount=Math.max(0,totalPrice-newPaid);
    saveState();logAct('미수수금:'+mname(p.memberId)+' '+fmt(amount)+'원 ('+dateStr+')');
    var newRemaining=calcRemainingUnpaid(p);
    alert('✅ 수금처리 완료!\n\n수금액: '+fmt(amount)+'원\n날짜: '+dateStr+'\n총 입금액: '+fmt(newPaid)+'원\n잔여 미수금: '+fmt(newRemaining)+'원'+(newRemaining===0?' 🎉 완납!':''));
    switchTab(CT==='unpaid'?'unpaid':'packages');
  };
}

// ── UNPAID TAB ──
function renderUnpaid(){
  var months=allMonths();var now=new Date();

function buildPayrollBody(){

function calcTrainerPay(trainerId,monthList){
  var result={sessions:[],totalPay:0,totalQty:0,monthlyData:{}};
  // 모든 회원의 미할당 세션 먼저 정리
  S.members.forEach(function(m){assignSessionsToPkgs(m.id);});
  monthList.forEach(function(month){
    var sess=S.sessions.filter(function(s){return s.type==='use'&&s.date.startsWith(month)&&s.trainerId===trainerId;});
    sess.forEach(function(s){
      // ★ packageId로 정확한 상품 찾기
      var pkg=null;
      if(s.packageId){
        pkg=S.packages.find(function(p){return p.id===s.packageId&&!p.isRefund;});
      }
      // packageId 없거나 못찾으면 해당 월 기준 가장 가까운 상품
      if(!pkg){
        pkg=S.packages.filter(function(p){
          return p.memberId==s.memberId&&!p.isRefund&&!p.refunded&&p.startDate<=s.date;
        }).sort(function(a,b){return b.startDate.localeCompare(a.startDate);})[0];
      }
      var priceVat=pkg?pkg.pricePerSession:0;
      var pExVat=pkg?getExVatPrice(priceVat,pkg.payType):0;
      var rt=(pkg&&pkg.regType)||'new';
      var pct=REG_PCT[rt]||45;
      var qty=Number(s.qty||1);
      var pay=Math.round(pExVat*pct/100*qty);
      result.sessions.push({date:s.date,memberId:s.memberId,priceVat:priceVat,pExVat:pExVat,rt:rt,pct:pct,pay:pay,qty:qty});
      result.totalPay+=pay;result.totalQty+=qty;
      if(!result.monthlyData[month])result.monthlyData[month]={pay:0,qty:0};
      result.monthlyData[month].pay+=pay;result.monthlyData[month].qty+=qty;
    });
  });
  return result;
}
function buildPayrollMonthly(trainersToShow,isAdmin){
  var month=payMonth;
  var totalUse=S.sessions.filter(function(s){return s.type==='use'&&s.date.startsWith(month);}).reduce(function(s,x){return s+Number(x.qty||1);},0);
  var totalPay=0;
  var cards=trainersToShow.map(function(t){
    var td=calcTrainerPay(t.id,[month]);
    var base=t.base||0;totalPay+=td.totalPay+base;
    return buildTrainerCard(t,td,month,month);
  }).join('');
  var metrics=isAdmin?'<div class="metric-grid" style="margin-bottom:12px">'+
  '<div class="metric"><div class="metric-label">총 수업</div><div class="metric-value">'+totalUse+'회</div></div>'+
  '<div class="metric"><div class="metric-label">총 지급 예정</div><div class="metric-value">'+fmt(totalPay)+'원</div></div>'+
  '<div class="metric"><div class="metric-label">대상 직원</div><div class="metric-value">'+trainersToShow.length+'명</div></div>'+
  '</div>':'';
  return metrics+cards;
}

function importSessionExcel(e){
  var file=e.target.files[0];if(!file)return;
  var script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  script.onload=function(){
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var wb=XLSX.read(ev.target.result,{type:'binary',cellFormula:false});
        var sheetName=wb.SheetNames.find(function(n){return n.includes('수업소진')||n.includes('소진')||n.includes('수업');});
        if(!sheetName)sheetName=wb.SheetNames[0];
        if(!sheetName){alert('⚠️ 시트를 찾을 수 없어요!');return;}
        var ws=wb.Sheets[sheetName];
        // 헤더가 몇 행에 있는지 찾기 (월/회원명 등이 있는 행)
        var rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false,header:1});
        var headerRow=-1;
        for(var hi=0;hi<Math.min(rows.length,10);hi++){
          var rv=rows[hi];
          for(var ci=0;ci<rv.length;ci++){
            var cv=String(rv[ci]||'').trim();
            if(cv==='월'||cv==='회원명'||cv==='소진횟수'){headerRow=hi;break;}
          }
          if(headerRow>=0)break;
        }
        // 헤더 못찾으면 첫행으로
        if(headerRow<0)headerRow=0;
        var dataRows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false,range:headerRow});
        var added=0,skipped=0,errors=[];
        function getMonth(v){
          if(!v)return '';
          var s=String(v).trim();
          if(s.match(/^\d{4}-\d{2}/))return s.slice(0,7);
          if(s.match(/^\d{4}\/\d{2}/))return s.slice(0,4)+'-'+s.slice(5,7);
          if(!isNaN(Number(s))&&Number(s)>10000){
            var d=new Date(Math.round((Number(s)-25569)*86400*1000));
            return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0');
          }
          return s.slice(0,7);
        }
        dataRows.forEach(function(r,i){
          var keys=Object.keys(r);
          var month=getMonth(r['월']||r[keys[0]]||'');
          var memberName=String(r['회원명']||r['회원']||r[keys[1]]||'').trim();
          var trainerName=String(r['트레이너']||r['담당트레이너']||r[keys[2]]||'').trim();
          var qty=Number(r['소진횟수']||r['횟수']||r[keys[3]]||0);
          var memo=String(r['메모']||r[keys[4]]||'').trim();
          if(!month||!memberName||!qty)return;
          if(memberName==='회원명'||memberName==='회원'||memberName==='★필수')return;
          if(!month.match(/^\d{4}-\d{2}/))return;
          var m=S.members.find(function(x){return x.name===memberName;});
          if(!m){errors.push((i+1)+'행: 회원 "'+memberName+'" 없음');skipped++;return;}
          var t=S.trainers.find(function(x){return x.name===trainerName||x.name.includes(trainerName)||trainerName.includes(x.name);})||null;
          S.sessions.push({id:uid(),type:'use',memberId:m.id,trainerId:t?t.id:'',date:month+'-01',qty:qty,memo:memo||'엑셀 수업소진'});
          added++;
        });
        if(!added&&!skipped&&!errors.length){
          alert('⚠️ 가져올 데이터가 없어요!\n\n확인사항:\n1. 시트 이름: 수업소진\n2. 헤더: 월/회원명/트레이너/소진횟수\n3. 월 형식: 2025-09 또는 2025-09-01');
          return;
        }
        var msg='✅ 수업소진 불러오기 완료!\n\n추가: '+added+'건\n건너뜀: '+skipped+'건';
        if(errors.length)msg+='\n\n⚠️ 오류 (회원명 불일치):\n'+errors.slice(0,10).join('\n');
        msg+='\n\n저장할까요?';
        if(!confirm(msg))return;
        // 명시적으로 localStorage에도 저장
        SS('jng_sessions',S.sessions);
        saveState();
        alert('✅ 저장 완료!\n'+added+'건 수업소진이 추가됐어요.\n\n회원관리에서 잔여횟수를 확인해보세요!');
        switchTab('members');
      }catch(err){alert('파일 오류: '+err.message);}
    };
    reader.readAsBinaryString(file);
  };
  document.head.appendChild(script);
  e.target.value='';
}

function importExcel(e){
  var file=e.target.files[0];if(!file)return;
  var script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  script.onload=function(){
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var wb=XLSX.read(ev.target.result,{type:'binary',cellFormula:false});
        var result={members:[],packages:[],sessions:[]};
        // 날짜 변환
        function toDateStr(v){
          if(!v)return '';
          if(typeof v==='number'){var d=new Date(Math.round((v-25569)*86400*1000));return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');}
          return String(v).trim().slice(0,10);
        }
        // 트레이너 매칭 (부분 이름도 허용)
        function findTrainer(name){
          if(!name)return null;
          var n=String(name).trim();
          return S.trainers.find(function(t){return t.name===n||t.name.includes(n)||n.includes(t.name);})||null;
        }
        // 숫자 변환 (수식이면 0)
        function toNum(v){
          if(!v&&v!==0)return 0;
          if(typeof v==='string'&&v.startsWith('='))return 0;
          return Number(v)||0;
        }
        // 회원목록
        if(wb.SheetNames.indexOf('회원목록')>=0){
          var ws=wb.Sheets['회원목록'];
          var rows=XLSX.utils.sheet_to_json(ws,{defval:''});
          rows.forEach(function(r){
            var name=String(r['이름']||'').trim();
            if(!name||name==='이름'||name.includes('필수')||name.includes('★'))return;
            result.members.push({id:uid(),name:name,phone:String(r['연락처']||'').trim(),regdate:toDateStr(r['등록일']),memo:String(r['메모']||'').trim()});
          });
        }
        // 매출현황

function importData(e){

  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      if(!confirm('데이터를 불러올까요?\n\n현재 데이터가 모두 덮어씌워집니다.'))return;
      if(data.members)S.members=data.members;if(data.packages)S.packages=data.packages;
      if(data.sessions)S.sessions=data.sessions;if(data.trainers)S.trainers=data.trainers;
      if(data.lockers)S.lockers=data.lockers;if(data.accounts)S.accounts=data.accounts;
      if(data.deletedLog)S.deletedLog=data.deletedLog;
      saveState();alert('✅ 복원 완료!');switchTab('settings');
    }catch(err){alert('파일 오류: '+err.message);}
  };
  reader.readAsText(file);e.target.value='';
}

</script><script>// Monthly payroll derived from package-linked consumption records.

function apCalculate(t,month){
  var legacy=t.payrollHistorySettings&&t.payrollHistorySettings[month];
  var sales=S.packages.filter(function(p){return !p.isRefund&&p.trainerId===t.id&&String(p.startDate).slice(0,7)===month;});
  // Commission tiers use registration revenue INCLUDING VAT.
  var revenue=sales.reduce(function(a,p){return a+Number(p.totalSessions||0)*Number(p.pricePerSession||0)/1.1;},0);
  var revenueVat=sales.reduce(function(a,p){return a+Number(p.totalSessions||0)*Number(p.pricePerSession||0);},0);
  var tier=revenueVat>=7000000?3:revenueVat>=5000000?2:revenueVat>=3000000?1:0;
  var rates=[[.4,.4],[.4,.45],[.45,.5],[.45,.55]][tier];
  var warnings=[];
  var sessions=S.sessions.filter(function(s){return s.type==='use'&&s.trainerId===t.id&&String(s.date).slice(0,7)===month;});
  sessions.forEach(function(s){if(!s.packageId||!S.packages.some(function(p){return p.id===s.packageId&&!p.isRefund;}))warnings.push(mname(s.memberId)+' 소진 기록의 상품 연결을 확인해주세요.');});
  var rows=S.packages.filter(function(p){return !p.isRefund&&String(p.startDate).slice(0,7)<=month&&(p.trainerId===t.id||sessions.some(function(s){return s.packageId===p.id;}));}).map(function(p){
    var prior=S.sessions.filter(function(s){return s.type==='use'&&s.packageId===p.id&&String(s.date).slice(0,7)<month;}).reduce(function(a,s){return a+Number(s.qty||1);},0);
    var qty=sessions.filter(function(s){return s.packageId===p.id;}).reduce(function(a,s){return a+Number(s.qty||1);},0);
    var allCurrent=S.sessions.filter(function(s){return s.type==='use'&&s.packageId===p.id&&String(s.date).slice(0,7)===month;}).reduce(function(a,s){return a+Number(s.qty||1);},0);
    var returning=p.regType==='re'||p.regType==='intro';
    var rate=legacy?(returning?.55:.45):t.payEmployment==='freelance'?(returning?.55:.45):rates[returning?1:0],unit=legacy?(p.payType==='cash'?Number(p.pricePerSession||0):Math.round(Number(p.pricePerSession||0)/1.1)):Number(p.pricePerSession||0)/1.1;
    var rowPay=legacy?sessions.filter(function(s){return s.packageId===p.id;}).reduce(function(a,s){return a+Math.round(unit*rate*Number(s.qty||1));},0):qty*unit*rate;
    var transfers=(S.members.find(function(m){return m.id===p.memberId;})||{}).handovers||[];
    var owner=transfers.length&&typeof apTrainerOn==='function'?apTrainerOn(p.memberId,month+'-31'):p.trainerId;
    var transferNote=transfers.map(function(h){return h.date+' '+tname(h.from)+' → '+tname(h.to);}).join(' / ');
    return [p.startDate,mname(p.memberId),Number(p.totalSessions||0)*Number(p.pricePerSession||0),Number(p.totalSessions||0)*Number(p.pricePerSession||0)/1.1,Number(p.totalSessions||0),unit,Number(p.totalSessions||0)-prior,qty,Number(p.totalSessions||0)-prior-allCurrent,REG_LABEL[p.regType||'new']||'신규',rate,unit*rate,rowPay,owner===t.id?(Number(p.totalSessions||0)-prior-allCurrent)*unit*rate:0,t.name,transferNote];
  }).filter(function(row){return row[7]>0;});
  var lesson=Math.round(rows.reduce(function(a,r){return a+r[12];},0));
  var employment=t.payEmployment||'';
  var support=legacy?Number(legacy.base||0):employment==='freelance'?0:employment==='part'?500000:employment==='full'?700000:Number(t.base||0);
  if(!legacy&&!['part','full','freelance'].includes(employment))warnings.push('회원 관리 상단에서 '+t.name+' 직원의 고용형태를 먼저 선택해주세요.');
  var incentive=legacy?0:employment==='freelance'?0:tier===3?200000:tier===2?100000:0;
  var gross=lesson+support+incentive;
  var tax=!legacy&&t.payTax==='exact'?Math.round(gross*.033):Math.floor(gross*.03/10)*10+Math.floor(gross*.003/10)*10;

  return {sales:sales,revenue:revenue,revenueVat:revenueVat,rows:rows,lesson:lesson,support:support,incentive:incentive,gross:gross,tax:tax,net:gross-tax,warnings:warnings,legacy:!!legacy};
}

var apBatchMonth='',apBatchPackage='';
var apOriginalDefaultTrainer=getMemberDefaultTrainer;
function apTrainerOn(mid,date){
  var m=S.members.find(function(x){return x.id===mid;}),h=m&&m.handovers||[];
  if(m&&m.manualAllocationTrainerId)return m.manualAllocationTrainerId;
  if(!h.length)return apOriginalDefaultTrainer(mid);
  var owner=h[0].from;h.forEach(function(x){if(x.date<=date)owner=x.to;});return owner;
}
// Current assignment is explicit. Empty selection must never fall back to sales history.
getMemberDefaultTrainer=function(mid){
  var m=S.members.find(function(x){return String(x.id)===String(mid);});if(!m)return '';
  var id=Object.prototype.hasOwnProperty.call(m,'manualAllocationTrainerId')?m.manualAllocationTrainerId:m.defaultTrainerId;
  if(id===undefined||id===null||String(id).trim()==='')return '';

};
function apChangeMemberTrainer(mid,tid){

  m.defaultTrainerId=tid;m.manualAllocationTrainerId=tid;

function apAllocationTrainers(mid,pid,month){
  var list=S.trainers.map(function(t){return {id:t.id,name:t.name};});
  S.sessions.filter(function(s){return s.type==='use'&&s.memberId===mid&&s.packageId===pid&&String(s.date).slice(0,7)===month;}).forEach(function(s){if(!list.some(function(t){return t.id===s.trainerId;}))list.push({id:s.trainerId,name:tname(s.trainerId)||'퇴사/미등록 트레이너'});});return list;
}

  if(!pkgs.some(function(p){return p.id===apBatchPackage;}))apBatchPackage=pkgs.length?pkgs[0].id:'';
  var p=pkgs.find(function(x){return x.id===apBatchPackage;}),existing=p?S.sessions.filter(function(s){return s.type==='use'&&s.memberId===m.id&&s.packageId===p.id&&String(s.date).slice(0,7)===apBatchMonth;}):[];
  var total=existing.reduce(function(a,s){return a+Number(s.qty||1);},0);
  var trainers=apAllocationTrainers(m.id,apBatchPackage,apBatchMonth);
  return '<div id="monthly-allocation-panel" style="background:var(--info-light);border:1px solid #a8c0e8;border-radius:8px;padding:14px;margin-bottom:10px"><div style="font-size:12px;font-weight:700;color:var(--info)">📝 소진 등록 · 선생님별 횟수 나누기</div><p style="margin:8px 0">정산할 월과 횟수권을 선택하고, 각 선생님이 진행한 <strong>그 달의 최종 횟수</strong>를 입력하세요. 다음 달에 입력해도 선택한 월로 정산됩니다. 이미 저장한 횟수가 표시되며, 다시 저장하면 입력한 최종 횟수로 변경됩니다.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"><input aria-label="소진 정산월" type="month" id="allocation-month" value="'+apEscape(apBatchMonth)+'" onchange="if(this.value){apBatchMonth=this.value;switchTab(\'members\');}"><select aria-label="정산 횟수권" id="allocation-package" onchange="apBatchPackage=this.value;switchTab(\'members\');">'+pkgs.map(function(x){return '<option value="'+apEscape(x.id)+'" '+(x.id===apBatchPackage?'selected':'')+'>'+apEscape(x.startDate)+' 등록 · '+x.totalSessions+'회권</option>';}).join('')+'</select></div>'+(p?'<p>현재 이 달 저장 합계: <strong>'+total+'회</strong> · 현재 전체 잔여: '+getPkgBalance(p.id,p.totalSessions)+'회</p><div class="fg3" style="margin-top:8px">'+trainers.map(function(t){var qty=existing.filter(function(s){return s.trainerId===t.id;}).reduce(function(a,s){return a+Number(s.qty||1);},0);return '<div class="field"><label>'+apEscape(t.name)+' 진행 횟수</label><input type="number" min="0" step="1" data-allocation-trainer="'+apEscape(t.id)+'" value="'+qty+'" oninput="apUpdateAllocationTotal()"></div>';}).join('')+'</div><p id="allocation-total" style="margin:8px 0">입력 합계: '+total+'회</p><button class="btn" style="background:#f5a800;color:#2d2418;font-weight:700" onclick="apSaveAllocation(\''+apEscape(m.id)+'\')">소진 등록 / 재배분</button>':'<p>정산할 유효한 횟수권이 없습니다.</p>')+'</div>';
}
function apUpdateAllocationTotal(){var sum=0;document.querySelectorAll('[data-allocation-trainer]').forEach(function(el){sum+=Number(el.value||0);});var el=document.getElementById('allocation-total');if(el)el.textContent='입력 합계: '+sum+'회';}
function apCommitAllocation(mid,pid,month,allocations){
  if(!CU||CU.role!=='admin')throw new Error('관리자만 횟수를 재배분할 수 있습니다.');
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month))throw new Error('정산월을 선택해주세요.');
  var m=S.members.find(function(x){return x.id===mid;}),p=S.packages.find(function(x){return x.id===pid&&x.memberId===mid&&!x.isRefund&&!x.refunded;});
  if(!m||!p)throw new Error('정산할 회원과 유효한 횟수권을 확인해주세요.');
  if(String(p.startDate).slice(0,7)>month)throw new Error('횟수권 등록월 이전으로 소진을 등록할 수 없습니다.');
  var isTarget=function(s){return s.type==='use'&&s.memberId===mid&&s.packageId===pid&&String(s.date).slice(0,7)===month;};
  var before=S.sessions.filter(isTarget),seen=new Set(),total=0;
  allocations.forEach(function(a){if(!a.trainerId||seen.has(a.trainerId)||!Number.isSafeInteger(a.qty)||a.qty<0)throw new Error('직원별 횟수는 0 이상의 정수로 한 번씩 입력해주세요.');seen.add(a.trainerId);if(!S.trainers.some(function(t){return t.id===a.trainerId;})&&!before.some(function(s){return s.trainerId===a.trainerId;}))throw new Error('등록되지 않은 트레이너입니다.');total+=a.qty;});
  var other=S.sessions.filter(function(s){return s.type==='use'&&s.packageId===pid&&!isTarget(s);}).reduce(function(a,s){return a+Number(s.qty||1);},0);
  if(total+other>Number(p.totalSessions))throw new Error('잔여 횟수가 부족합니다. 이 달에 배분 가능한 최대 횟수: '+Math.max(0,Number(p.totalSessions)-other)+'회');
  var after=[];
  allocations.forEach(function(a){var prior=before.filter(function(s){return s.trainerId===a.trainerId;}),qty=prior.reduce(function(n,s){return n+Number(s.qty||1);},0);if(qty===a.qty){after.push.apply(after,prior);}else if(a.qty>0){after.push({id:uid(),type:'use',memberId:mid,trainerId:a.trainerId,packageId:pid,date:month+'-01',qty:a.qty,memo:'월말 일괄 정산',monthlyAggregate:true});}});
  if(JSON.stringify(before)===JSON.stringify(after))return {changed:false,total:total};
  if(!m.allocationHistory)m.allocationHistory=[];
  m.allocationHistory.push({id:uid(),month:month,packageId:pid,at:new Date().toISOString(),by:CU.id,before:JSON.parse(JSON.stringify(before)),after:JSON.parse(JSON.stringify(after))});
  S.sessions=S.sessions.filter(function(s){return !isTarget(s);}).concat(after);
  saveState();logAct('월말 소진 재배분:'+m.name+' '+month+' '+total+'회');return {changed:true,total:total};
}
function apSaveAllocation(mid){
  try{var month=document.getElementById('allocation-month').value,pid=document.getElementById('allocation-package').value;
    var rows=Array.from(document.querySelectorAll('[data-allocation-trainer]')).map(function(el){return {trainerId:el.getAttribute('data-allocation-trainer'),qty:el.value.trim()===''?0:Number(el.value)};});
    var result=apCommitAllocation(mid,pid,month,rows);selectedMember=S.members.find(function(m){return m.id===mid;});switchTab('members');alert(result.changed?'저장했습니다. '+month+'의 선생님별 횟수로 페이롤에 반영됩니다.':'변경된 횟수가 없습니다.');
  }catch(e){alert(e.message);}
}

    historyControl+'<button class="btn btn-success" onclick="apExport(apSelectedTrainer,autoPayMonth)">📥 페이롤 엑셀 다운로드</button></div>';
