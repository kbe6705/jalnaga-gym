<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>잘나가GYM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo',sans-serif;background:#f5f0e8;color:#2d2418;font-size:13px}
:root{--accent:#f5a800;--accent2:#e07800;--gold:#f5a800;--green:#2e7d32;--green-light:#e8f5e9;--danger:#b71c1c;--danger-light:#fff0f0;--info:#1565c0;--info-light:#e3f2fd;--warn:#e65100;--text:#2d2418;--text2:#6b5f45;--text3:#9e8f70;--surface:#fffdf7;--surface2:#f0ebe0;--border:#e0d0b8;--border2:#c8b89a;--radius:10px;}
.nav{background:#1a1710;padding:0 16px;display:flex;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.nav-brand{color:var(--gold);font-weight:800;font-size:16px;padding:14px 16px 14px 0;white-space:nowrap}
.nav-tabs{display:flex;overflow-x:auto;flex:1}
.tab{background:none;border:none;color:#aaa;padding:14px 12px;cursor:pointer;font-size:12px;white-space:nowrap;border-bottom:3px solid transparent;transition:.2s}
.tab.active{color:#fff;border-bottom-color:var(--gold)}
.tab:hover:not(.active){color:#ddd}
.nav-right{display:flex;align-items:center;gap:8px;margin-left:auto;padding-left:12px}
.nav-user{color:#ccc;font-size:11px;white-space:nowrap}
.main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.section-title{font-size:16px;font-weight:700}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;border-top:3px solid var(--accent)}
.metric-label{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.metric-value{font-size:18px;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border:1.5px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer;font-size:13px;font-family:inherit;transition:.15s}
.btn:hover{background:var(--surface2)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:var(--accent2)}
.btn-primary:hover{opacity:.9}
.btn-danger{background:#fde8e8;color:var(--danger);border-color:#f5b4b4}
.btn-success{background:var(--green-light);color:var(--green);border-color:#a5d6a7}
.btn-edit{background:#e3f2fd;color:var(--info);border-color:#90caf9}
.btn-sm{padding:4px 10px;font-size:11px}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{background:var(--surface2);padding:8px;text-align:left;font-weight:700;color:var(--text2);border-bottom:2px solid var(--border);white-space:nowrap}
.data-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tr:hover td{background:#fffbf3}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1.5px solid var(--border2);border-radius:6px;font-size:13px;font-family:inherit;background:#fff;color:var(--text)}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fg4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.iform{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.iform-title{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--accent2)}
.hidden{display:none!important}
.vat-hint{font-size:10px;color:var(--text3);margin-top:3px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.badge-blue{background:#dbeafe;color:#1e40af}.badge-green{background:#dcfce7;color:#166534}
.badge-amber{background:#fef3c7;color:#92400e}.badge-red{background:#fee2e2;color:#991b1b}.badge-gray{background:#f3f4f6;color:#374151}
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-tab{padding:5px 14px;border:1.5px solid var(--border2);border-radius:99px;background:var(--surface);cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.filter-tab.active{background:var(--accent);color:#fff;border-color:var(--accent2)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1710,#2d2418)}
.login-box{background:#fff;border-radius:16px;padding:36px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{text-align:center;font-size:28px;font-weight:900;color:var(--accent2);margin-bottom:8px}
.login-sub{text-align:center;color:#888;font-size:12px;margin-bottom:28px}
.msearch-wrap{position:relative}
.msearch-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--border2);border-radius:6px;z-index:200;max-height:180px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.msearch-item{padding:8px 12px;cursor:pointer;font-size:13px}
.msearch-item:hover{background:var(--surface2)}
.locker-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.locker-cell{aspect-ratio:1;border:1.5px solid var(--border);border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;transition:.15s;background:var(--surface)}
.locker-cell.used{background:#fff3cd;border-color:#f5a800}.locker-cell.empty{background:#e8f5e9;border-color:#66bb6a}
.locker-cell:hover{transform:scale(1.05)}
.empty{text-align:center;color:var(--text3);padding:30px;font-size:14px}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
const S={members:[],packages:[],sessions:[],trainers:[],lockers:{},accounts:{},actLog:[],deletedLog:[]};
let CU=null,CT='',selectedMember=null;
let salesView='monthly',salesMonth='',salesDate='';
let ptFilter='all',sessMonth='';
let payMode='monthly',payMonth='',payRangeFrom='',payRangeTo='',payTrainerFilter='all',expandedTrainer='';
let unpaidView='all',unpaidMonth='',unpaidDate='',unpaidYear='';

var GAS_URL='https://script.google.com/macros/s/AKfycbxEvCTUeuzv_jJ90kruEUI2iVSw81_AGVEdzoACbKcAmrh6oucrhnaG7BJPbfegClAn/exec';
var _saving=false;

function LS(k,d){if(d===undefined)d='[]';try{var v=localStorage.getItem(k);return JSON.parse(v!==null?v:d);}catch(e){try{return JSON.parse(d);}catch(e2){return [];}}}
function SS(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

// 구글시트에서 데이터 불러오기
function loadState(){
  // 우선 localStorage에서 빠르게 로드 (오프라인 대비)
  S.members=LS('jng_members');S.packages=LS('jng_packages');S.sessions=LS('jng_sessions');
  S.trainers=LS('jng_trainers');S.lockers=LS('jng_lockers','{}');
  S.actLog=LS('jng_actlog');S.deletedLog=LS('jng_deletedlog');
  var acc=LS('jng_accounts','null');
  if(acc&&typeof acc==='object'&&!Array.isArray(acc)&&Object.keys(acc).length>0)S.accounts=acc;
  else S.accounts={admin:{id:'admin',pw:'1234',role:'admin',name:'관리자',trainerId:''}};
}

// 구글시트에서 최신 데이터 가져오기
function syncFromCloud(callback){
  showSyncBanner('☁️ 데이터 불러오는 중...');
  fetch(GAS_URL)
  .then(function(r){return r.json();})
  .then(function(res){
    if(res.ok&&res.data&&res.data.length>2){
      try{
        var d=JSON.parse(res.data);
        if(d.members)S.members=d.members;
        if(d.packages)S.packages=d.packages;
        if(d.sessions)S.sessions=d.sessions;
        if(d.trainers)S.trainers=d.trainers;
        if(d.lockers)S.lockers=d.lockers;
        if(d.accounts)S.accounts=d.accounts;
        if(d.deletedLog)S.deletedLog=d.deletedLog;
        // localStorage도 최신화
        SS('jng_members',S.members);SS('jng_packages',S.packages);
        SS('jng_sessions',S.sessions);SS('jng_trainers',S.trainers);
        SS('jng_lockers',S.lockers);SS('jng_accounts',S.accounts);
        SS('jng_deletedlog',S.deletedLog);
        hideSyncBanner();
        if(callback)callback(true);
      }catch(e){hideSyncBanner();if(callback)callback(false);}
    } else {
      hideSyncBanner();if(callback)callback(false);
    }
  })
  .catch(function(){hideSyncBanner();if(callback)callback(false);});
}

// 구글시트에 저장
function saveState(){
  // localStorage 즉시 저장 (빠른 반응)
  SS('jng_members',S.members);SS('jng_packages',S.packages);SS('jng_sessions',S.sessions);
  SS('jng_trainers',S.trainers);SS('jng_lockers',S.lockers);SS('jng_accounts',S.accounts);
  SS('jng_actlog',S.actLog);SS('jng_deletedlog',S.deletedLog);
  // 구글시트에 비동기 저장
  if(_saving)return;_saving=true;
  showSyncBanner('💾 저장 중...');
  var payload=JSON.stringify({
    members:S.members,packages:S.packages,sessions:S.sessions,
    trainers:S.trainers,lockers:S.lockers,accounts:S.accounts,
    deletedLog:S.deletedLog||[]
  });
  fetch(GAS_URL,{
    method:'POST',
    body:JSON.stringify({data:payload})
  })
  .then(function(r){return r.json();})
  .then(function(res){
    _saving=false;
    if(res.ok)showSyncBanner('✅ 저장 완료!',1500);
    else showSyncBanner('⚠️ 저장 실패',2000);
  })
  .catch(function(){
    _saving=false;
    showSyncBanner('⚠️ 네트워크 오류 (로컬 저장됨)',2000);
  });
}

function showSyncBanner(msg,autoHideMs){
  var b=document.getElementById('sync-banner');
  if(!b){
    b=document.createElement('div');b.id='sync-banner';
    b.style.cssText='position:fixed;bottom:16px;right:16px;background:#1a1710;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;z-index:99999;box-shadow:0 4px 16px rgba(0,0,0,.3);transition:.3s';
    document.body.appendChild(b);
  }
  b.textContent=msg;b.style.opacity='1';
  if(autoHideMs)setTimeout(hideSyncBanner,autoHideMs);
}
function hideSyncBanner(){
  var b=document.getElementById('sync-banner');
  if(b)b.style.opacity='0';
}
function logAct(a){S.actLog.push({ts:new Date().toISOString(),userId:CU?CU.id:'',action:a});if(S.actLog.length>500)S.actLog=S.actLog.slice(-500);}

// AUTH
function doLogin(){
  var id=document.getElementById('login-id').value.trim();
  var pw=document.getElementById('login-pw').value;
  var acc=Object.values(S.accounts).find(function(a){return a.id===id&&a.pw===pw;});
  if(!acc){alert('아이디 또는 비밀번호가 틀렸어요');return;}
  CU=acc;SS('jng_session',{id:acc.id,ts:Date.now()});
  logAct('로그인:'+id);saveState();initApp();
}
function doLogout(){SS('jng_session',null);CU=null;selectedMember=null;document.getElementById('app').innerHTML=renderLogin();}
function renderLogin(){
  return '<div class="login-wrap"><div class="login-box">'+
  '<div class="login-logo">&#128170; 잘나가GYM</div>'+
  '<div class="login-sub">PT샵 관리 시스템</div>'+
  '<div class="field"><label>아이디</label><input id="login-id" placeholder="아이디" onkeydown="if(event.key===\'Enter\')doLogin()"></div>'+
  '<div class="field"><label>비밀번호</label><input id="login-pw" type="password" placeholder="비밀번호" onkeydown="if(event.key===\'Enter\')doLogin()"></div>'+
  '<button class="btn btn-primary" style="width:100%;padding:12px;font-size:15px" onclick="doLogin()">로그인</button>'+
  '</div></div>';
}

// NAV
var TABS_ADMIN=[{id:'members',label:'회원 관리'},{id:'lockers',label:'락카 관리'},{id:'packages',label:'매출현황'},{id:'unpaid',label:'💰 미수금'},{id:'sessions',label:'수업 기록'},{id:'payroll',label:'급여 정산'},{id:'settings',label:'설정'}];
var TABS_STAFF=[{id:'members',label:'회원 관리'},{id:'lockers',label:'락카 현황'},{id:'packages',label:'매출현황'},{id:'unpaid',label:'💰 미수금'},{id:'sessions',label:'내 수업 기록'},{id:'payroll',label:'내 급여'}];
function buildNav(){
  var tabs=CU.role==='admin'?TABS_ADMIN:TABS_STAFF;
  document.getElementById('nav-tabs').innerHTML=tabs.map(function(t){return '<button class="tab" id="nav-'+t.id+'" onclick="switchTab(\''+t.id+'\')">'+t.label+'</button>';}).join('');
}
function switchTab(t){
  CT=t;
  var tabs=CU.role==='admin'?TABS_ADMIN:TABS_STAFF;
  tabs.forEach(function(x){var el=document.getElementById('nav-'+x.id);if(el)el.classList.toggle('active',x.id===t);});
  var mc=document.getElementById('main-content');
  try{
    if(t==='members')mc.innerHTML=renderMembers();
    else if(t==='lockers')mc.innerHTML=renderLockers();
    else if(t==='packages')mc.innerHTML=renderPackages();
    else if(t==='unpaid')mc.innerHTML=renderUnpaid();
    else if(t==='sessions')mc.innerHTML=renderSessions();
    else if(t==='payroll')mc.innerHTML=renderPayroll();
    else if(t==='settings')mc.innerHTML=renderSettings();
  }catch(e){mc.innerHTML='<div class="card"><div class="empty">오류: '+e.message+'</div></div>';}
}
function refreshSales(){if(CT==='packages')switchTab('packages');}
function initApp(){
  var now=new Date();
  salesMonth=now.getFullYear()+'-'+(now.getMonth()+1).toString().padStart(2,'0');
  salesDate=today();sessMonth=salesMonth;
  payMonth=salesMonth;payRangeFrom=salesMonth;payRangeTo=salesMonth;
  unpaidMonth=salesMonth;unpaidYear=String(now.getFullYear());unpaidDate=today();
  document.getElementById('app').innerHTML=
  '<nav class="nav"><div class="nav-brand">&#128170; 잘나가GYM</div>'+
  '<div class="nav-tabs" id="nav-tabs"></div>'+
  '<div class="nav-right"><span class="nav-user">'+CU.name+'('+(CU.role==='admin'?'관리자':'직원')+')</span>'+
  '<button class="btn btn-sm" onclick="doLogout()">로그아웃</button></div></nav>'+
  '<div class="main"><div id="main-content"></div></div>';
  buildNav();switchTab('members');
}

// HELPERS
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');}
function fmt(n){return Number(n||0).toLocaleString('ko-KR');}
function mname(id){var m=S.members.find(function(x){return x.id==id;});return m?m.name:'?';}
function tname(id){var t=S.trainers.find(function(x){return x.id==id;});return t?t.name:'-';}
function exVat(p){return Math.round(p/1.1);}
function allMonths(){var res=[],d=new Date();for(var i=0;i<48;i++){res.push(d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0'));d.setMonth(d.getMonth()-1);}return res;}
function getMemberBalance(memberId){
  var added=S.sessions.filter(function(s){return s.memberId==memberId&&s.type==='add';}).reduce(function(s,x){return s+Number(x.qty||1);},0);
  var used=S.sessions.filter(function(s){return s.memberId==memberId&&s.type==='use';}).reduce(function(s,x){return s+Number(x.qty||1);},0);
  return added-used;
}
function getMemberDefaultTrainer(memberId){
  var m=S.members.find(function(x){return x.id==memberId;});
  if(m&&m.defaultTrainerId)return m.defaultTrainerId;
  var p=S.packages.filter(function(x){return x.memberId==memberId&&!x.isRefund;}).sort(function(a,b){return b.startDate.localeCompare(a.startDate);})[0];
  return p?p.trainerId:'';
}
function getMemberUnpaid(memberId){return S.packages.filter(function(p){return p.memberId==memberId&&!p.isRefund;}).reduce(function(s,p){return s+calcRemainingUnpaid(p);},0);}
function calcRemainingUnpaid(p){return Math.max(0,Number(p.unpaidAmount||0));}
function calcUnpaidCollected(p){return (p.unpaidCollections||[]).reduce(function(s,c){return s+Number(c.amount||0);},0);}
function getExVatPrice(price,payType){return payType==='cash'?price:Math.round(price/1.1);}
function calcEndDate(startDate,total){
  if(!startDate||!total)return '';
  var d=new Date(startDate);d.setDate(d.getDate()+Math.ceil(total/10)*30);
  return d.toISOString().split('T')[0];
}
var REG_PCT={new:45,re:55,intro:55};
var REG_LABEL={'new':'신규',re:'재등록',intro:'소개'};
var REG_BADGE={'new':'badge-blue',re:'badge-green',intro:'badge-amber'};
var PAY_LABEL={card:'카드',cash:'현금',cashreceipt:'현금영수증',refund:'환불'};
function showIForm(id){var el=document.getElementById(id);if(el)el.classList.remove('hidden');}
function hideIForm(id){var el=document.getElementById(id);if(el)el.classList.add('hidden');}
function toggleDetailForm(id){var el=document.getElementById(id);if(el)el.classList.toggle('hidden');}
function hideDetailForm(id){var el=document.getElementById(id);if(el)el.classList.add('hidden');}
function vatPreview(priceId,vatId){
  var el=document.getElementById(priceId),price=el?parseInt(el.value)||0:0,vat=Math.round(price/11),vel=document.getElementById(vatId);
  if(vel)vel.textContent=price>0?'부가세 '+fmt(vat)+'원 / VAT제외 '+fmt(price-vat)+'원':'';
}
function msHtml(inputId,hiddenId,ph){
  ph=ph||'회원 검색...';
  return '<div class="msearch-wrap" id="mswrap-'+hiddenId+'">'+
  '<input type="text" id="'+inputId+'" placeholder="'+ph+'" autocomplete="off" '+
  'oninput="msSearch(\''+inputId+'\',\''+hiddenId+'\')" onfocus="msSearch(\''+inputId+'\',\''+hiddenId+'\')">'+
  '<input type="hidden" id="'+hiddenId+'">'+
  '<div id="msdrop-'+hiddenId+'" class="msearch-dropdown hidden"></div></div>';
}
function msSearch(inputId,hiddenId){
  var q=(document.getElementById(inputId).value||'').toLowerCase();
  var drop=document.getElementById('msdrop-'+hiddenId);if(!drop)return;
  var matches=S.members.filter(function(m){return m.name.toLowerCase().includes(q)||(m.phone&&m.phone.includes(q));});
  if(!matches.length){drop.classList.add('hidden');return;}
  drop.classList.remove('hidden');
  drop.innerHTML=matches.slice(0,10).map(function(m){return '<div class="msearch-item" onclick="msPick(\''+m.id+'\',\''+inputId+'\',\''+hiddenId+'\')">'+m.name+(m.phone?' ('+m.phone+')':'')+'</div>';}).join('');
}
function msPick(mid,inputId,hiddenId){
  var m=S.members.find(function(x){return x.id===mid;});if(!m)return;
  document.getElementById(inputId).value=m.name;document.getElementById(hiddenId).value=mid;
  var drop=document.getElementById('msdrop-'+hiddenId);if(drop)drop.classList.add('hidden');
}
function goToMember(mid){
  selectedMember=S.members.find(function(m){return m.id===mid;})||null;
  if(!selectedMember){alert('회원 정보를 찾을 수 없어요');return;}
  switchTab('members');
}

// ── MEMBERS ──
function renderMembers(){
  if(selectedMember){return renderMemberDetail(selectedMember);}
  var isAdmin=CU.role==='admin';
  var memberSearchQ=window._memberSearchQ||'';
  var memberTrainerFilter=window._memberTrainerFilter||'';
  var list=S.members.filter(function(m){
    if(memberSearchQ){
      var q=memberSearchQ.toLowerCase();
      if(!m.name.toLowerCase().includes(q)&&!(m.phone&&m.phone.includes(q)))return false;
    }
    if(memberTrainerFilter){
      var latestPkg=S.packages.filter(function(p){return p.memberId==m.id&&!p.isRefund;}).sort(function(a,b){return b.startDate.localeCompare(a.startDate);})[0];
      if(!latestPkg||latestPkg.trainerId!==memberTrainerFilter)return false;
    }
    return true;
  }).map(function(m){
    var bal=getMemberBalance(m.id);
    var unpaid=getMemberUnpaid(m.id);
    var latestPkg=S.packages.filter(function(p){return p.memberId==m.id&&!p.isRefund;}).sort(function(a,b){return b.startDate.localeCompare(a.startDate);})[0];
    var endDate=m.endDate||(latestPkg?calcEndDate(latestPkg.startDate,latestPkg.totalSessions):'');
    var expired=endDate&&endDate<today();
    var lockerNum=Object.keys(S.lockers).find(function(k){return S.lockers[k]&&S.lockers[k].memberId==m.id;});
    var lockerPw=lockerNum&&S.lockers[lockerNum]?S.lockers[lockerNum].pw:'';

function memberFilterList(){
  var q=(window._memberSearchQ||'').toLowerCase();
  var tFilter=window._memberTrainerFilter||'';
  var filtered=S.members.filter(function(m){
    if(q&&!m.name.toLowerCase().includes(q)&&!(m.phone&&m.phone.includes(q)))return false;
    if(tFilter){
      var lp=S.packages.filter(function(p){return p.memberId==m.id&&!p.isRefund;}).sort(function(a,b){return b.startDate.localeCompare(a.startDate);})[0];
      if(!lp||lp.trainerId!==tFilter)return false;
    }
    return true;
  });
  var tbody=document.querySelector('#member-table tbody');
  if(!tbody)return;
  tbody.innerHTML=filtered.map(function(m){
    var bal=getMemberBalance(m.id);
    var unpaid=getMemberUnpaid(m.id);
    var latestPkg=S.packages.filter(function(p){return p.memberId==m.id&&!p.isRefund;}).sort(function(a,b){return b.startDate.localeCompare(a.startDate);})[0];
    var endDate=m.endDate||(latestPkg?calcEndDate(latestPkg.startDate,latestPkg.totalSessions):'');
    var expired=endDate&&endDate<today();
    var lockerNum=Object.keys(S.lockers).find(function(k){return S.lockers[k]&&S.lockers[k].memberId==m.id;});
    var lockerPw=lockerNum&&S.lockers[lockerNum]?S.lockers[lockerNum].pw:'';
    return '<tr onclick="selectedMember=S.members.find(function(x){return x.id===\''+m.id+'\'});switchTab(\'members\')" style="cursor:pointer">'+
    '<td><strong>'+m.name+'</strong>'+(expired?'<span style="color:var(--danger);font-size:10px;margin-left:4px">⚠️만료</span>':'')+'</td>'+
    '<td style="color:var(--text2)">'+(m.phone||'-')+'</td>'+
    '<td>'+(latestPkg?tname(latestPkg.trainerId):(m.defaultTrainerId?tname(m.defaultTrainerId):'-'))+'</td>'+
    '<td><strong style="color:'+(bal<=0?'var(--danger)':'var(--accent2)')+'">'+bal+'회</strong></td>'+
    '<td style="color:var(--text2);font-size:11px">'+(endDate||'-')+'</td>'+
    '<td>'+(lockerNum?'<span style="background:#fff3cd;color:#856404;font-weight:700;padding:2px 8px;border-radius:4px;font-size:12px">'+lockerNum+'번</span>'+(lockerPw?' <span style="font-size:11px;color:var(--text2)">'+lockerPw+'</span>':''):'-')+'</td>'+
    '<td>'+(unpaid>0?'<span style="color:var(--danger);font-weight:700">'+fmt(unpaid)+'원</span>':'-')+'</td>'+
    '</tr>';
  }).join('');
  // 필터 탭 active 상태 업데이트
  document.querySelectorAll('#member-filter-tabs .filter-tab').forEach(function(btn){
    btn.classList.toggle('active',btn.getAttribute('data-tid')===(tFilter||''));
  });
}
function saveMember(){
  var name=document.getElementById('m-name').value.trim();

  var trainerId=document.getElementById('m-trainer').value;
  var m={id:uid(),name:name,phone:document.getElementById('m-phone').value,regdate:document.getElementById('m-regdate').value,memo:document.getElementById('m-memo').value,defaultTrainerId:trainerId};

function calcDetailPaid(mid){
  var qty=parseInt(document.getElementById('dpkg-qty-'+mid)?document.getElementById('dpkg-qty-'+mid).value:0)||0;
  var price=parseInt(document.getElementById('dpkg-price-'+mid)?document.getElementById('dpkg-price-'+mid).value:0)||0;
  var total=qty*price;
  var paid=document.getElementById('dpkg-paid-'+mid);
  if(paid&&!paid.dataset.manual)paid.value=total||'';
  var unpaid=document.getElementById('dpkg-unpaid-'+mid);
  if(unpaid)unpaid.value=0;
}
function calcDetailUnpaid(mid){
  var qty=parseInt(document.getElementById('dpkg-qty-'+mid)?document.getElementById('dpkg-qty-'+mid).value:0)||0;
  var price=parseInt(document.getElementById('dpkg-price-'+mid)?document.getElementById('dpkg-price-'+mid).value:0)||0;
  var total=qty*price;
  var paid=parseInt(document.getElementById('dpkg-paid-'+mid)?document.getElementById('dpkg-paid-'+mid).value:0)||0;
  var unpaid=document.getElementById('dpkg-unpaid-'+mid);
  if(unpaid)unpaid.value=Math.max(0,total-paid);
}
function saveDetailPkg(mid){
  var trainerId=document.getElementById('dpkg-trainer-'+mid)?document.getElementById('dpkg-trainer-'+mid).value:'';
  var regType=document.getElementById('dpkg-type-'+mid)?document.getElementById('dpkg-type-'+mid).value:'new';
  var qty=parseInt(document.getElementById('dpkg-qty-'+mid)?document.getElementById('dpkg-qty-'+mid).value:0)||0;
  var price=parseInt(document.getElementById('dpkg-price-'+mid)?document.getElementById('dpkg-price-'+mid).value:0)||0;
  var payType=document.getElementById('dpkg-paytype-'+mid)?document.getElementById('dpkg-paytype-'+mid).value:'card';
  var date=document.getElementById('dpkg-date-'+mid)?document.getElementById('dpkg-date-'+mid).value:today();
  var paid=parseInt(document.getElementById('dpkg-paid-'+mid)?document.getElementById('dpkg-paid-'+mid).value:0)||qty*price;
  var unpaidAmt=parseInt(document.getElementById('dpkg-unpaid-'+mid)?document.getElementById('dpkg-unpaid-'+mid).value:0)||0;
  var approvalNo=document.getElementById('dpkg-approvalNo-'+mid)?document.getElementById('dpkg-approvalNo-'+mid).value:'';
  var cardNo=document.getElementById('dpkg-cardNo-'+mid)?document.getElementById('dpkg-cardNo-'+mid).value:'';
  var memo=document.getElementById('dpkg-memo-'+mid)?document.getElementById('dpkg-memo-'+mid).value:'';
  if(!qty||!price){alert('횟수와 단가를 입력해주세요');return;}
  var p={id:uid(),memberId:mid,trainerId:trainerId,regType:regType,totalSessions:qty,pricePerSession:price,startDate:date,payType:payType,paidAmount:paid,originalPaid:paid,unpaidAmount:unpaidAmt,approvalNo:approvalNo,cardNo:cardNo,memo:memo,isRefund:false,unpaidCollections:[]};
  S.packages.push(p);
  S.sessions.push({id:uid(),type:'add',memberId:mid,trainerId:trainerId,packageId:p.id,date:date,qty:qty,memo:'횟수권 등록'});
  if(!S.members.find(function(x){return x.id===mid;}).defaultTrainerId&&trainerId){S.members.find(function(x){return x.id===mid;}).defaultTrainerId=trainerId;}
  saveState();logAct('횟수권등록:'+mname(mid)+' '+qty+'회');
  selectedMember=S.members.find(function(x){return x.id===mid;});switchTab('members');
}
function calcDetailRefPenalty(mid){
  var amtEl=document.getElementById('dref-amount-'+mid);
  var penEl=document.getElementById('dref-penalty-'+mid);
  if(!amtEl||!penEl||penEl.dataset.manual)return;
  penEl.value=Math.round((parseInt(amtEl.value)||0)*0.1);
}
function saveDetailRefund(mid){
  var trainerId=document.getElementById('dref-trainer-'+mid)?document.getElementById('dref-trainer-'+mid).value:'';
  var sessions=parseInt(document.getElementById('dref-sessions-'+mid)?document.getElementById('dref-sessions-'+mid).value:0)||0;
  var price=parseInt(document.getElementById('dref-price-'+mid)?document.getElementById('dref-price-'+mid).value:0)||0;
  var amount=parseInt(document.getElementById('dref-amount-'+mid)?document.getElementById('dref-amount-'+mid).value:0)||0;
  var penEl=document.getElementById('dref-penalty-'+mid);
  var penalty=penEl&&penEl.value?parseInt(penEl.value)||Math.round(amount*0.1):Math.round(amount*0.1);
  var date=document.getElementById('dref-date-'+mid)?document.getElementById('dref-date-'+mid).value:today();
  if(!amount){alert('환불 금액을 입력해주세요');return;}
  S.packages.push({id:uid(),memberId:mid,trainerId:trainerId,regType:'re',totalSessions:0,pricePerSession:price||0,startDate:date,isRefund:true,refundSessions:sessions,refundAmount:amount,penaltyAmount:penalty,refundDate:date,paidAmount:0,unpaidAmount:0,payType:'refund',memo:'',unpaidCollections:[]});
  saveState();logAct('환불등록:'+mname(mid)+' '+fmt(amount)+'원');
  selectedMember=S.members.find(function(x){return x.id===mid;});switchTab('members');
}
// 특정 상품의 잔여 횟수
function getPkgBalance(pkgId, totalSessions){
  var used=S.sessions.filter(function(s){return s.type==='use'&&s.packageId===pkgId;}).reduce(function(s,x){return s+Number(x.qty||1);},0);
  return Math.max(0, totalSessions-used);
}
// 가장 오래된 유효 상품 (등록일 오름차순, 잔여 있는 것)
function getOldestActivePkg(mid){
  return S.packages.filter(function(p){
    return p.memberId==mid&&!p.isRefund&&!p.refunded&&p.totalSessions>0;
  }).sort(function(a,b){return a.startDate.localeCompare(b.startDate);})
  .find(function(p){return getPkgBalance(p.id,p.totalSessions)>0;});
}

function saveDetailUse(mid){
  try{
    var trainerEl=document.getElementById('duse-trainer-'+mid);
    var monthEl=document.getElementById('duse-month-'+mid);
    var qtyEl=document.getElementById('duse-qty-'+mid);
    if(!trainerEl||!monthEl||!qtyEl){alert('입력 폼을 찾을 수 없어요');return;}
    var trainerId=trainerEl.value;var month=monthEl.value;var qty=parseInt(qtyEl.value)||0;
    if(!trainerId){alert('트레이너를 선택해주세요');return;}
    if(!qty||qty<1){alert('횟수를 입력해주세요');return;}
    // 가장 먼저 등록한 유효 상품 찾기
    var activePkg=getOldestActivePkg(mid);
    if(!activePkg){alert('⚠️ 사용 가능한 횟수권이 없어요!\n\n모든 상품의 횟수가 소진됐거나 환불됐어요.');return;}
    var remaining=getPkgBalance(activePkg.id,activePkg.totalSessions);
    if(remaining<qty){
      alert('⚠️ 현재 상품 잔여 횟수 부족!\n\n상품: '+activePkg.startDate+' 등록 ('+activePkg.totalSessions+'회)\n잔여: '+remaining+'회\n소진하려는 횟수: '+qty+'회\n\n'+remaining+'회 이하로 입력해주세요.');
      return;
    }
    S.sessions.push({id:uid(),type:'use',memberId:mid,trainerId:trainerId,packageId:activePkg.id,date:month+'-01',qty:qty,memo:''});
    var newRemaining=remaining-qty;
    saveState();logAct('수업소진:'+mname(mid)+' '+qty+'회 ('+activePkg.startDate+' 등록분, 잔여'+newRemaining+'회)');
    qtyEl.value='';
    if(newRemaining===0)alert('✅ 소진 완료!\n\n'+activePkg.startDate+' 등록 상품의 횟수가 모두 소진됐어요.');
    selectedMember=S.members.find(function(x){return x.id===mid;});switchTab('members');
  }catch(e){alert('오류: '+e.message);}
}

function deletePkgFromMember(pkgId,mid){
  var p=S.packages.find(function(x){return x.id===pkgId;});if(!p)return;
  var label=p.isRefund?'환불':'횟수권';
  if(!confirm('이 '+label+' 내역을 삭제할까요?\n\n'+mname(p.memberId)+' / '+p.startDate+'\n\n삭제 후 복구할 수 없어요.'))return;
  if(!S.deletedLog)S.deletedLog=[];
  S.deletedLog.unshift({ts:new Date().toISOString(),type:label,by:CU?CU.id:'',summary:mname(mid)+' / '+p.startDate,data:JSON.parse(JSON.stringify(p))});
  if(S.deletedLog.length>200)S.deletedLog=S.deletedLog.slice(0,200);
  S.packages=S.packages.filter(function(x){return x.id!==pkgId;});
  // 횟수권 삭제 시 연결된 횟수등록(add) 세션도 함께 삭제 → 잔여횟수 반영
  if(!p.isRefund){
    var deleted=false;
    // 1순위: packageId 정확히 매칭
    var before=S.sessions.length;
    S.sessions=S.sessions.filter(function(s){
      return !(s.memberId==mid&&s.type==='add'&&s.packageId===pkgId);
    });
    if(S.sessions.length<before){deleted=true;}
    // 2순위: packageId 없고 qty+date 매칭
    if(!deleted){
      before=S.sessions.length;
      S.sessions=S.sessions.filter(function(s){
        return !(s.memberId==mid&&s.type==='add'&&!s.packageId&&Number(s.qty||1)===p.totalSessions&&s.date===p.startDate);
      });
      if(S.sessions.length<before){deleted=true;}
    }
    // 3순위: packageId 없고 qty만 매칭 (날짜 무관, 가장 최근 것 1개만)
    if(!deleted){
      var found=false;
      S.sessions=S.sessions.filter(function(s){
        if(found)return true;
        if(s.memberId==mid&&s.type==='add'&&!s.packageId&&Number(s.qty||1)===p.totalSessions){
          found=true;return false;
        }
        return true;
      });
    }
  }
  saveState();logAct('결제삭제:'+mname(mid));selectedMember=S.members.find(function(x){return x.id===mid;});switchTab('members');
}
function deleteSessFromMember(sessId,mid){

function lkSearch(q){
  var el=document.getElementById('lk-search-result');
  if(!el)return;
  q=(q||'').trim().toLowerCase();
  if(!q){el.innerHTML='';return;}
  var results=[];
  Object.keys(S.lockers).forEach(function(n){
    var data=S.lockers[n]||{};
    if(!data.name)return;
    var matchName=data.name.toLowerCase().includes(q);
    var matchNum=String(n).includes(q);
    if(matchName||matchNum)results.push({n:n,data:data});
  });
  if(!results.length){
    el.innerHTML='<div style="color:var(--text3);font-size:13px;padding:8px 0">검색 결과 없음</div>';
    return;
  }
  el.innerHTML='<div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px">검색 결과 '+results.length+'건</div>'+
  results.map(function(r){

    'onmouseover="this.style.background=\'#fffbf0\';this.style.borderColor=\'var(--accent)\'" '+

    '<div style="flex:1">'+

  var name=nameInp?nameInp.value.trim():'';
  var pw=pwInp?pwInp.value.trim():'';
  var memberId=document.getElementById('lk-member-id')?document.getElementById('lk-member-id').value:'';
  if(!name){alert('이름을 입력해주세요');return;}
  // 기존 이 락카를 쓰던 회원이 있으면 락카 정보 제거
  Object.keys(S.lockers).forEach(function(k){
    if(S.lockers[k]&&S.lockers[k].memberId){
      if(S.lockers[k].memberId===memberId&&Number(k)!==Number(n)){
        // 같은 회원이 다른 락카에 있으면 기존 락카 비우기
        delete S.lockers[k];
      }
    }
  });
  S.lockers[n]={name:name,pw:pw,memberId:memberId};
  // 회원관리에도 락카 정보 기록
  if(memberId){
    var m=S.members.find(function(x){return x.id===memberId;});
    if(m){m.lockerNum=n;m.lockerPw=pw;}
  }
  saveState();logAct('락카저장:'+n+'번 '+name);
  var ol=document.getElementById('lk-overlay');if(ol)document.body.removeChild(ol);
  switchTab('lockers');
}
function lkClear(n){
  if(!confirm(n+'번 락카를 비울까요?'))return;
  // 연결된 회원의 락카 정보도 제거
  var data=S.lockers[n]||{};
  if(data.memberId){
    var m=S.members.find(function(x){return x.id===data.memberId;});
    if(m){delete m.lockerNum;delete m.lockerPw;}
  }
  delete S.lockers[n];
  saveState();logAct('락카비우기:'+n+'번');
  var ol=document.getElementById('lk-overlay');if(ol)document.body.removeChild(ol);
  switchTab('lockers');
}
function saveLocker(){
  var n=document.getElementById('lk-num')?document.getElementById('lk-num').value:'';
  var mid=document.getElementById('lk-member')?document.getElementById('lk-member').value:'';
  if(!n)return;
  if(mid)S.lockers[n]={memberId:mid};
  else delete S.lockers[n];
  saveState();switchTab('lockers');
}
function clearLocker(){
  var n=document.getElementById('lk-num')?document.getElementById('lk-num').value:'';
  if(n)delete S.lockers[n];
  saveState();switchTab('lockers');
}

// ── SALES ──
function getPkgs(){
  var list=S.packages;
  if(ptFilter==='refund')list=list.filter(function(p){return p.isRefund;});
  else if(ptFilter!=='all')list=list.filter(function(p){return !p.isRefund&&p.payType===ptFilter;});
  if(salesView==='monthly')list=list.filter(function(p){return p.startDate.startsWith(salesMonth);});
  else if(salesView==='daily')list=list.filter(function(p){return p.startDate===salesDate;});
  else if(salesView==='yearly'){
    var y=document.getElementById('sales-year')?document.getElementById('sales-year').value:new Date().getFullYear().toString();
    list=list.filter(function(p){return p.startDate.startsWith(y);});
  }
  return list;
}
function inViewDate(d){
  if(!d)return false;
  if(salesView==='monthly')return d.startsWith(salesMonth);
  if(salesView==='daily')return d===salesDate;
  if(salesView==='yearly'){var y=document.getElementById('sales-year')?document.getElementById('sales-year').value:new Date().getFullYear().toString();return d.startsWith(y);}
  return true;
}
function renderPackages(){

  var monthSel=months.map(function(m){return '<option value="'+m+'" '+(m===salesMonth?'selected':'')+'>'+m+'</option>';}).join('');
  return '<div class="section-header"><div class="section-title">매출현황</div>'+
  '<div style="font-size:12px;color:var(--text2);background:var(--surface2);padding:6px 12px;border-radius:6px">💡 횟수권·환불 등록은 <strong>회원 관리</strong>에서 해주세요</div></div>'+
  '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">'+
  '<div class="filter-tabs" style="margin-bottom:0">'+
  '<button class="filter-tab '+(salesView==='monthly'?'active':'')+'" onclick="salesView=\'monthly\';refreshSales()">월별</button>'+
  '<button class="filter-tab '+(salesView==='daily'?'active':'')+'" onclick="salesView=\'daily\';refreshSales()">일별</button>'+
  '<button class="filter-tab '+(salesView==='yearly'?'active':'')+'" onclick="salesView=\'yearly\';refreshSales()">연간</button>'+
  '</div>'+
  (salesView==='monthly'?'<select onchange="salesMonth=this.value;refreshSales()" style="width:auto">'+monthSel+'</select>':'')+
  (salesView==='daily'?'<input type="date" value="'+salesDate+'" onchange="salesDate=this.value;refreshSales()" style="padding:6px 8px;border:1.5px solid var(--border2);border-radius:6px;font-size:13px">':'')+
  (salesView==='yearly'?'<select id="sales-year" onchange="refreshSales()" style="width:auto">'+yearSel+'</select>':'')+
  '</div>'+
  '<div id="sales-summary">'+buildSalesSummary()+'</div>'+
  '<div class="filter-tabs" id="paytype-filters">'+
  '<button class="filter-tab active" onclick="setPTFilter(\'all\',this)">전체</button>'+
  '<button class="filter-tab" onclick="setPTFilter(\'card\',this)">카드</button>'+
  '<button class="filter-tab" onclick="setPTFilter(\'cash\',this)">현금</button>'+
  '<button class="filter-tab" onclick="setPTFilter(\'cashreceipt\',this)">현금영수증</button>'+
  '<button class="filter-tab" onclick="setPTFilter(\'refund\',this)">환불</button>'+
  '</div>'+
  '<div style="font-size:14px;font-weight:700;color:var(--text2);margin:14px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--border)">📋 등록 내역</div>'+
  '<div id="pkg-list">'+renderPackageList()+'</div>';

function setPTFilter(f,btn){
  ptFilter=f;
  document.querySelectorAll('#paytype-filters .filter-tab').forEach(function(b){b.classList.remove('active');});
  if(btn)btn.classList.add('active');
  var el=document.getElementById('pkg-list');if(el)el.innerHTML=renderPackageList();
  var sel=document.getElementById('sales-summary');if(sel)sel.innerHTML=buildSalesSummary();
}
function buildSalesSummary(){
  var savedFilter=ptFilter;ptFilter='all';
  var allPkgs=S.packages.filter(function(p){return !p.isRefund&&inViewDate(p.startDate);});
  var allRefunds=S.packages.filter(function(p){return p.isRefund&&inViewDate(p.startDate||p.refundDate);});
  ptFilter=savedFilter;
  // 이번 기간 수금 - 등록일 무관, 수금일 기준으로만 집계
  var collInView=[];
  S.packages.filter(function(p){return !p.isRefund&&p.unpaidCollections&&p.unpaidCollections.length;}).forEach(function(p){
    (p.unpaidCollections||[]).forEach(function(c){
      if(inViewDate(c.date))collInView.push({p:p,c:c,sameReg:inViewDate(p.startDate)});
    });
  });
  // 등록 매출: originalPaid(최초입금액)만 사용 - 수금액 제외
  var regRev=allPkgs.reduce(function(s,p){return s+(Number(p.originalPaid!==undefined?p.originalPaid:p.paidAmount)||0);},0);
  // 수금 매출: 수금일이 이번 기간인 것만 (등록월 관계없이)
  var collRev=collInView.reduce(function(s,x){return s+Number(x.c.amount||0);},0);
  var totalRev=regRev+collRev;
  var totalVat=allPkgs.reduce(function(s,p){if(p.payType==='cash')return s;return s+Math.round((Number(p.originalPaid!==undefined?p.originalPaid:p.paidAmount)||0)/11);},0);
  var totalExVat=totalRev-totalVat;
  var totalRefundAmt=allRefunds.reduce(function(s,p){
    return s+Number(p.refundAmount||0);
  },0);
  var totalPenaltyAmt=allRefunds.reduce(function(s,p){return s+Number(p.penaltyAmount||0);},0);
  var totalRefundTotal=totalRefundAmt;
  var totalUnpaid=allPkgs.reduce(function(s,p){return s+calcRemainingUnpaid(p);},0);
  var cardRev=allPkgs.filter(function(p){return p.payType==='card';}).reduce(function(s,p){return s+(Number(p.originalPaid!==undefined?p.originalPaid:p.paidAmount)||0);},0);
  var cashRev=allPkgs.filter(function(p){return p.payType==='cash';}).reduce(function(s,p){return s+(Number(p.originalPaid!==undefined?p.originalPaid:p.paidAmount)||0);},0);
  var crRev=allPkgs.filter(function(p){return p.payType==='cashreceipt';}).reduce(function(s,p){return s+(Number(p.originalPaid!==undefined?p.originalPaid:p.paidAmount)||0);},0);
  var netRev=totalRev-totalRefundTotal;
  // 트레이너별 - 같은 달 수금은 paidAmount에 이미 포함됨
  var tm={};
  allPkgs.forEach(function(p){
    var tid=p.trainerId||'';
    if(!tm[tid])tm[tid]={rev:0,cnt:0,refund:0,refundCnt:0,unpaidCnt:0,unpaidAmt:0};
    var rev=Number(p.originalPaid!==undefined?p.originalPaid:p.paidAmount)||0; // 최초입금액만
    tm[tid].rev+=rev;tm[tid].cnt++;
    if(calcRemainingUnpaid(p)>0){tm[tid].unpaidCnt++;tm[tid].unpaidAmt+=calcRemainingUnpaid(p);}
  });
  // 수금일 기준으로 해당 트레이너 매출에 추가 (등록월 관계없이 수금일이 이번기간인 것)
  collInView.forEach(function(x){
    var tid=x.p.trainerId||'';
    if(!tm[tid])tm[tid]={rev:0,cnt:0,refund:0,refundCnt:0,unpaidCnt:0,unpaidAmt:0};
    tm[tid].rev+=Number(x.c.amount||0);
  });
  allRefunds.forEach(function(p){
    var tid=p.trainerId||'';
    if(!tm[tid])tm[tid]={rev:0,cnt:0,refund:0,refundCnt:0,unpaidCnt:0,unpaidAmt:0};
    tm[tid].refund+=Number(p.refundAmount||0);tm[tid].refundCnt++;
  });
  var filterLabel={all:'전체',card:'카드',cash:'현금',cashreceipt:'현금영수증',refund:'환불'};
  var filterRev={all:totalRev,card:cardRev,cash:cashRev,cashreceipt:crRev,refund:0};
  var filterColor={all:'var(--accent2)',card:'var(--info)',cash:'var(--green)',cashreceipt:'var(--text)',refund:'var(--danger)'};
  var curRev=filterRev[ptFilter]!==undefined?filterRev[ptFilter]:totalRev;
  var curVat=ptFilter==='cash'?0:Math.round(curRev/11);
  var curExVat=curRev-curVat;
  var curLabel=filterLabel[ptFilter]||'전체';
  var trainerCards=S.trainers.map(function(t){
    var td=tm[t.id]||{rev:0,cnt:0,refund:0,refundCnt:0,unpaidCnt:0,unpaidAmt:0};
    var net=td.rev-td.refund;
    // 날짜별 내역 집계
    var dayMap={};
    allPkgs.filter(function(p){return p.trainerId===t.id;}).forEach(function(p){
      var d=p.startDate;
      if(!dayMap[d])dayMap[d]={rev:0,cnt:0,items:[],refunds:[],colls:[]};
      dayMap[d].rev+=Number(p.originalPaid!==undefined?p.originalPaid:p.paidAmount)||0; // 최초입금액만
      dayMap[d].cnt++;
      dayMap[d].items.push(p);
    });
    // 환불 건도 날짜별로 추가
    allRefunds.filter(function(p){return p.trainerId===t.id;}).forEach(function(p){
      var d=p.startDate||p.refundDate;
      if(!dayMap[d])dayMap[d]={rev:0,cnt:0,items:[],refunds:[],colls:[]};
      if(!dayMap[d].refunds)dayMap[d].refunds=[];
      dayMap[d].refunds.push(p);
      dayMap[d].rev-=Number(p.refundAmount||0);
    });
    // 수금은 수금일 기준으로만 표시 (등록월 관계없이)
    collInView.filter(function(x){return x.p.trainerId===t.id;}).forEach(function(x){
      var d=x.c.date;
      if(!dayMap[d])dayMap[d]={rev:0,cnt:0,items:[],refunds:[],colls:[]};
      if(!dayMap[d].colls)dayMap[d].colls=[];
      dayMap[d].rev+=Number(x.c.amount||0);
      dayMap[d].colls.push({p:x.p,c:x.c});
    });
    var days=Object.keys(dayMap).sort().reverse();
    var dayRows=days.map(function(d){
      var dm=dayMap[d];
      var hasRefund=dm.refunds&&dm.refunds.length>0;
      var itemRows=(dm.items||[]).map(function(p){
        var remaining=calcRemainingUnpaid(p);
        return '<tr><td>'+mname(p.memberId)+'</td>'+
        '<td><span class="badge '+REG_BADGE[p.regType||'new']+'">'+REG_LABEL[p.regType||'new']+'</span></td>'+
        '<td><span class="badge badge-gray">'+(PAY_LABEL[p.payType]||'-')+'</span></td>'+
        '<td><strong>'+fmt(Number(p.paidAmount)||0)+'원</strong>'+
        (remaining>0?'<div style="font-size:10px;color:var(--danger)">미수 '+fmt(remaining)+'원</div>':'')+
        '</td></tr>';
      }).join('');
      var refundRows=(dm.refunds||[]).map(function(p){
        var total=Number(p.refundAmount||0);
        return '<tr style="background:#fff5f5">'+
        '<td>'+mname(p.memberId)+'</td>'+
        '<td><span class="badge badge-red">환불</span></td>'+
        '<td><span style="font-size:10px;color:var(--danger)">위약금 '+fmt(p.penaltyAmount||0)+'원</span></td>'+
        '<td><strong style="color:var(--danger)">-'+fmt(total)+'원</strong>'+
        '<div style="font-size:10px;color:var(--text3)">환불액 '+fmt(p.refundAmount||0)+'원</div>'+
        '</td></tr>';
      }).join('');
      var collRows2=(dm.colls||[]).map(function(x){
        return '<tr style="background:#f0f7ff"><td>'+mname(x.p.memberId)+'</td>'+
        '<td><span style="background:#e3f2fd;color:var(--info);font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px">미수수금</span><div style="font-size:10px;color:var(--text3)">원등록:'+x.p.startDate+'</div></td>'+
        '<td><span class="badge badge-gray">'+(PAY_LABEL[x.c.payType]||'-')+'</span></td>'+
        '<td><strong style="color:var(--info)">'+fmt(x.c.amount)+'원</strong></td></tr>';
      }).join('');
      var netDay=dm.rev;
      return '<details style="margin-bottom:3px">'+
      '<summary style="cursor:pointer;padding:5px 8px;border-radius:5px;background:'+(hasRefund?'#fff5f5':'var(--surface2)')+';font-size:12px;display:flex;justify-content:space-between;align-items:center">'+
      '<span><strong>'+d+'</strong>&nbsp;'+dm.cnt+'건'+
      (hasRefund?'&nbsp;<span style="color:var(--danger);font-size:11px;font-weight:700">환불 '+dm.refunds.length+'건</span>':'')+
      (dm.colls&&dm.colls.length?'&nbsp;<span style="color:var(--info);font-size:11px">+미수수금'+dm.colls.length+'건</span>':'')+'</span>'+
      '<span style="font-weight:700;color:'+(netDay<0?'var(--danger)':'var(--accent2)')+'">'+fmt(netDay)+'원</span>'+
      '</summary>'+
      '<div style="overflow-x:auto;margin-top:4px">'+
      '<table class="data-table" style="font-size:11px">'+
      '<thead><tr><th>회원</th><th>유형</th><th>비고</th><th>금액</th></tr></thead>'+
      '<tbody>'+collRows2+itemRows+refundRows+'</tbody></table></div>'+
      '</details>';
    }).join('');
    return '<div class="card" style="border-top:3px solid var(--accent);margin-bottom:0">'+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:'+(days.length?'10':'0')+'px">'+
    '<div style="width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">'+t.name.slice(0,2)+'</div>'+
    '<div style="flex:1"><div style="font-weight:700">'+t.name+'</div>'+
    '<div style="font-size:11px;color:var(--text2)">'+td.cnt+'건'+
    (td.refundCnt>0?'&nbsp;<span style="color:var(--danger);font-weight:700">/ 환불 '+td.refundCnt+'건 (-'+fmt(td.refund)+'원)</span>':'')+
    (td.unpaidCnt>0?' <span style="color:var(--danger)">/ 미수 '+td.unpaidCnt+'건</span>':'')+'</div></div>'+
    '<div style="text-align:right">'+
    '<div style="font-size:15px;font-weight:700">'+fmt(td.rev)+'원</div>'+
    (td.refund>0?'<div style="font-size:11px;color:var(--danger)">환불 -'+fmt(td.refund)+'원</div>':'')+
    '<div style="font-size:13px;font-weight:700;color:'+(net<0?'var(--danger)':'var(--accent2)')+'">순매출 '+fmt(net)+'원</div>'+

    (days.length?'<div style="border-top:1px solid var(--border);padding-top:8px">'+dayRows+'</div>':'')+
    '</div>';
  }).join('');
  return '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">'+
  '<div class="card" style="border-top:3px solid '+(filterColor[ptFilter]||'var(--accent2)')+';margin-bottom:0;padding:14px">'+
  '<div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-bottom:6px">'+curLabel+' 매출</div>'+
  '<div style="font-size:22px;font-weight:700;color:'+(filterColor[ptFilter]||'var(--accent2)')+'">'+fmt(curRev)+'원</div>'+
  (ptFilter!=='cash'&&ptFilter!=='refund'?'<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><div style="font-size:11px;color:var(--text2)">부가세 <strong style="color:var(--warn)">'+fmt(curVat)+'원</strong></div><div style="font-size:11px;color:var(--text2)">VAT제외 <strong>'+fmt(curExVat)+'원</strong></div></div>':'')+
  (ptFilter==='all'?'<details style="margin-top:8px"><summary style="font-size:11px;font-weight:700;color:var(--text2)">결제수단별 ▾</summary>'+
  '<div style="margin-top:6px;display:flex;flex-direction:column;gap:4px">'+

  '<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 8px;background:var(--green-light);border-radius:4px"><span style="color:var(--green);font-weight:700">현금</span><strong>'+fmt(cashRev)+'원</strong></div>'+
  '<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 8px;background:var(--surface2);border-radius:4px"><span style="font-weight:700">현금영수증</span><strong>'+fmt(crRev)+'원</strong></div>'+
  (totalUnpaid>0?'<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 8px;background:var(--danger-light);border-radius:4px"><span style="color:var(--danger);font-weight:700">잔여미수금</span><span style="color:var(--danger);font-weight:700">'+fmt(totalUnpaid)+'원</span></div>':'')+
  '</div></details>':'')+
  '</div>'+

function renderPackageList(){
  var list=getPkgs().sort(function(a,b){return b.startDate.localeCompare(a.startDate);});
  // 이번 기간 수금 행 (등록일이 이번 기간 밖)
  var collRows=[];
  if(ptFilter==='all'||ptFilter==='card'||ptFilter==='cash'||ptFilter==='cashreceipt'){
    S.packages.filter(function(p){return !p.isRefund&&!inViewDate(p.startDate)&&p.unpaidCollections&&p.unpaidCollections.length;}).forEach(function(p){
      (p.unpaidCollections||[]).forEach(function(c){
        if(!inViewDate(c.date))return;
        if(ptFilter!=='all'&&c.payType!==ptFilter)return;
        collRows.push({p:p,c:c});
      });
    });
  }
  collRows.sort(function(a,b){return b.c.date.localeCompare(a.c.date);});
  if(!list.length&&!collRows.length)return '<div class="card"><div class="empty">내역 없음</div></div>';
  var collHtml=collRows.map(function(x){
    var pt=PAY_LABEL[x.c.payType]||x.c.payType||'-';
    var cardInfo=x.c.payType==='card'?[x.c.cardco,x.c.cardno,x.c.approvalNo].filter(Boolean).join(' · '):(x.c.payType==='cashreceipt'?x.c.crno||'':'');
    return '<tr style="background:#f0f7ff;border-left:4px solid var(--info)">'+
    '<td><strong style="color:var(--info)">'+x.c.date+'</strong></td>'+
    '<td><strong>'+mname(x.p.memberId)+'</strong></td>'+
    '<td>'+tname(x.p.trainerId)+'</td>'+
    '<td><span style="background:#e3f2fd;color:var(--info);font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px">미수금수금</span><div style="font-size:10px;color:var(--text3)">원등록:'+x.p.startDate+'</div></td>'+
    '<td>-</td><td>-</td><td>-</td><td>-</td>'+
    '<td><span class="badge badge-gray">'+pt+'</span>'+(cardInfo?'<div style="font-size:10px;color:var(--text3)">'+cardInfo+'</div>':'')+
    '</td><td><strong style="color:var(--info)">'+fmt(x.c.amount)+'원</strong></td>'+
    '<td>-</td><td>-</td><td>-</td>'+
    '<td><button class="btn btn-sm" onclick="goToMember(\''+x.p.memberId+'\')" style="color:var(--info);border-color:#a8c0e8;font-size:11px">회원관리</button></td>'+
    '</tr>';
  }).join('');
  var rows=list.map(function(p){
    if(p.isRefund){
      return '<tr style="background:#fff5f5">'+
      '<td>'+p.startDate+'</td><td><strong>'+mname(p.memberId)+'</strong></td><td>'+tname(p.trainerId)+'</td>'+
      '<td><span class="badge badge-red">환불</span></td>'+
      '<td>-'+(p.refundSessions||0)+'회</td><td>-</td><td>-</td><td>-</td><td>-</td>'+
      '<td>-</td><td>-</td>'+
      '<td style="color:var(--danger)">'+
        '<strong>-'+fmt(p.refundAmount||0)+'원</strong>'+
        (p.penaltyAmount?'<div style="font-size:10px;color:var(--text3)">위약금 '+fmt(p.penaltyAmount)+'원 포함</div>':'')+
      '</td>'+
      '<td>-</td>'+
      '<td><button class="btn btn-sm" onclick="goToMember(\''+p.memberId+'\')" style="color:var(--info);border-color:#a8c0e8;font-size:11px">회원관리</button></td>'+
      '</tr>';
    }
    var rt=p.regType||'new';var pct=REG_PCT[rt]||45;
    var opaid=Number(p.originalPaid!==undefined?p.originalPaid:p.paidAmount)||0;
    var pExVat=p.payType==='cash'?opaid:Math.round(opaid/1.1);
    var pVat=p.payType==='cash'?0:opaid-pExVat;
    var remaining=calcRemainingUnpaid(p);
    var hasUnpaid=remaining>0;
    var hasColl=calcUnpaidCollected(p)>0;
    return '<tr'+(hasUnpaid?' style="background:#fff8f8"':'')+'>'+
    '<td>'+p.startDate+'</td>'+
    '<td><strong>'+mname(p.memberId)+'</strong></td>'+
    '<td>'+tname(p.trainerId)+'</td>'+
    '<td><span class="badge '+REG_BADGE[rt]+'">'+REG_LABEL[rt]+' '+pct+'%</span>'+(hasUnpaid?'<div style="font-size:10px;color:var(--danger);font-weight:700">● 미수금</div>':'')+'</td>'+
    '<td>'+p.totalSessions+'회</td>'+
    '<td>'+fmt(p.pricePerSession)+'원'+(p.payType==='cash'?' <span style="font-size:10px;color:var(--green)">(현금·VAT없음)</span>':'')+'</td>'+
    '<td><strong>'+fmt(pExVat)+'원</strong></td>'+
    '<td style="color:var(--text2)">'+(p.payType==='cash'?'-':fmt(pVat)+'원')+'</td>'+
    '<td><span class="badge badge-gray">'+(PAY_LABEL[p.payType]||'-')+'</span>'+(p.approvalNo?'<div style="font-size:10px;color:var(--text3)">'+p.approvalNo+'</div>':'')+'</td>'+
    '<td>'+
    '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'+
    '<strong>'+fmt(p.paidAmount||p.totalSessions*p.pricePerSession)+'원</strong>'+
    (hasColl&&remaining===0?'<span style="background:#fff3cd;color:#856404;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid #ffc107">(미수금)</span>':'')+
    (hasUnpaid?'<span style="background:#fde8e8;color:var(--danger);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid #f5b4b4">미수잔여</span>':'')+
    '</div>'+
    (hasColl?'<div style="font-size:10px;color:var(--text3);margin-top:2px">최초 '+fmt(p.originalPaid||0)+'원 +수금 '+fmt(calcUnpaidCollected(p))+'원</div>':'')+
    (hasUnpaid?'<div style="font-size:10px;color:var(--danger)">잔여 '+fmt(remaining)+'원</div>':'')+
    '</td>'+
    '<td>'+(hasUnpaid||hasColl?
    '<div style="display:flex;flex-direction:column;gap:2px">'+
    (hasUnpaid?'<span style="color:var(--danger);font-weight:700">'+fmt(remaining)+'원</span>':'<span style="color:var(--green);font-size:11px;font-weight:700">✓완납</span>')+
    (p.unpaidCollections||[]).map(function(c){var pt2=PAY_LABEL[c.payType]||c.payType||'';return '<span style="font-size:10px;color:var(--info)">📅 '+c.date+' '+fmt(c.amount)+'원 '+pt2+'</span>';}).join('')+
    (hasUnpaid?'<button class="btn btn-sm btn-success" onclick="collectUnpaid(\''+p.id+'\')" style="font-size:10px;padding:2px 6px">수금처리</button>':'')+
    '</div>':'-')+'</td>'+
    '<td>-</td><td style="color:var(--text2)">'+(p.memo||'-')+'</td>'+
    '<td><button class="btn btn-sm" onclick="goToMember(\''+p.memberId+'\')" style="color:var(--info);border-color:#a8c0e8;font-size:11px">회원관리</button></td>'+
    '</tr>';
  }).join('');
  return '<div class="card" style="overflow-x:auto"><table class="data-table">'+
  '<thead><tr><th>일자</th><th>회원</th><th>트레이너</th><th>유형</th><th>횟수</th><th>단가(VAT포함)</th><th>단가(VAT제외)</th><th>부가세</th><th>결제</th><th>입금</th><th>미수</th><th>환불</th><th>메모</th><th></th></tr></thead>'+
  '<tbody>'+collHtml+rows+'</tbody></table></div>';
}

// ── COLLECT UNPAID ──
function collectUnpaid(pkgId){
  var p=S.packages.find(function(x){return x.id===pkgId;});if(!p)return;
  var remaining=calcRemainingUnpaid(p);
  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center';
  overlay.innerHTML='<div style="background:#fff;border-radius:12px;padding:24px;width:360px;box-shadow:0 8px 32px rgba(0,0,0,.2);font-family:inherit">'+
  '<div style="font-size:15px;font-weight:700;margin-bottom:4px">💰 미수금 수금처리</div>'+
  '<div style="font-size:12px;color:#666;margin-bottom:16px">'+mname(p.memberId)+' · 잔여 <strong style="color:#b01a1a">'+fmt(remaining)+'원</strong></div>'+
  '<div style="margin-bottom:10px"><label style="font-size:11px;font-weight:700;color:#6b5f45;display:block;margin-bottom:4px">결제수단</label>'+
  '<select id="collect-paytype" onchange="var cv=this.value;document.getElementById(\'collect-card-d\').style.display=cv===\'card\'?\'block\':\'none\';document.getElementById(\'collect-cr-d\').style.display=cv===\'cashreceipt\'?\'block\':\'none\'" style="width:100%;padding:8px 10px;border:1.5px solid #e0d0b8;border-radius:6px;font-size:14px;font-family:inherit">'+
  '<option value="cash">현금</option><option value="card">카드</option><option value="cashreceipt">현금영수증</option></select></div>'+
  '<div id="collect-card-d" style="display:none;background:#f0f7ff;border-radius:8px;padding:10px;margin-bottom:10px">'+
  '<div class="fg2" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
  '<div><label style="font-size:11px;font-weight:700;color:#6b5f45;display:block;margin-bottom:3px">카드사</label><input id="collect-cardco" placeholder="신한,삼성..." style="width:100%;padding:6px 8px;border:1.5px solid #e0d0b8;border-radius:6px;font-size:13px"></div>'+
  '<div><label style="font-size:11px;font-weight:700;color:#6b5f45;display:block;margin-bottom:3px">카드번호</label><input id="collect-cardno" placeholder="카드번호" style="width:100%;padding:6px 8px;border:1.5px solid #e0d0b8;border-radius:6px;font-size:13px"></div>'+
  '<div style="grid-column:span 2"><label style="font-size:11px;font-weight:700;color:#6b5f45;display:block;margin-bottom:3px">승인번호</label><input id="collect-approvalNo" placeholder="승인번호" style="width:100%;padding:6px 8px;border:1.5px solid #e0d0b8;border-radius:6px;font-size:13px"></div>'+
  '</div></div>'+
  '<div id="collect-cr-d" style="display:none;background:#f0fff4;border-radius:8px;padding:10px;margin-bottom:10px">'+
  '<label style="font-size:11px;font-weight:700;color:#6b5f45;display:block;margin-bottom:3px">현금영수증 번호</label>'+
  '<input id="collect-crno" placeholder="현금영수증 번호" style="width:100%;padding:6px 8px;border:1.5px solid #e0d0b8;border-radius:6px;font-size:13px">'+
  '</div>'+
  '<div style="margin-bottom:10px"><label style="font-size:11px;font-weight:700;color:#6b5f45;display:block;margin-bottom:4px">수금 금액</label>'+
  '<input id="collect-amount" type="number" value="'+remaining+'" style="width:100%;padding:8px 10px;border:1.5px solid #e0d0b8;border-radius:6px;font-size:14px;font-family:inherit"></div>'+
  '<div style="margin-bottom:16px"><label style="font-size:11px;font-weight:700;color:#6b5f45;display:block;margin-bottom:4px">수금 날짜</label>'+
  '<input id="collect-date" type="date" value="'+today()+'" style="width:100%;padding:8px 10px;border:1.5px solid #e0d0b8;border-radius:6px;font-size:14px;font-family:inherit"></div>'+
  '<div style="display:flex;gap:8px;justify-content:flex-end">'+
  '<button id="collect-cancel" style="padding:8px 16px;border:1px solid #e0d0b8;border-radius:6px;background:#fff;cursor:pointer;font-family:inherit;font-size:13px">취소</button>'+
  '<button id="collect-ok" style="padding:8px 20px;border:none;border-radius:6px;background:linear-gradient(135deg,#f5a800,#e07800);color:#fff;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px">수금처리</button>'+
  '</div></div>';
  document.body.appendChild(overlay);
  document.getElementById('collect-cancel').onclick=function(){document.body.removeChild(overlay);};
  overlay.onclick=function(e){if(e.target===overlay)document.body.removeChild(overlay);};
  document.getElementById('collect-ok').onclick=function(){
    var amount=parseInt(document.getElementById('collect-amount').value)||0;
    var dateStr=document.getElementById('collect-date').value;
    var payType=document.getElementById('collect-paytype').value;
    var cardco=document.getElementById('collect-cardco')?document.getElementById('collect-cardco').value:'';
    var cardno=document.getElementById('collect-cardno')?document.getElementById('collect-cardno').value:'';
    var approvalNo=document.getElementById('collect-approvalNo')?document.getElementById('collect-approvalNo').value:'';
    var crno=document.getElementById('collect-crno')?document.getElementById('collect-crno').value:'';
    if(!amount||amount<=0){alert('금액을 입력해주세요');return;}
    if(amount>remaining){alert('잔여 미수금('+fmt(remaining)+'원)보다 많을 수 없어요');return;}
    if(!dateStr){alert('날짜를 선택해주세요');return;}
    document.body.removeChild(overlay);
    if(!p.unpaidCollections)p.unpaidCollections=[];
    if(p.originalPaid===undefined)p.originalPaid=Number(p.paidAmount)||0;
    var rec={date:dateStr,amount:amount,payType:payType};
    if(cardco)rec.cardco=cardco;if(cardno)rec.cardno=cardno;if(approvalNo)rec.approvalNo=approvalNo;if(crno)rec.crno=crno;
    p.unpaidCollections.push(rec);
    p.paidAmount=(p.originalPaid||0)+calcUnpaidCollected(p);
    p.unpaidAmount=Math.max(0,(Number(p.unpaidAmount)||0)-amount);
    saveState();logAct('미수수금:'+mname(p.memberId)+' '+fmt(amount)+'원 ('+dateStr+')');
    var newRemaining=calcRemainingUnpaid(p);
    alert('✅ 수금처리 완료!\n\n수금액: '+fmt(amount)+'원\n날짜: '+dateStr+'\n총 입금액: '+fmt(p.paidAmount)+'원\n잔여 미수금: '+fmt(newRemaining)+'원'+(newRemaining===0?' 🎉 완납!':''));
    switchTab(CT==='unpaid'?'unpaid':'packages');
  };
}

// ── UNPAID TAB ──
function renderUnpaid(){
  var months=allMonths();var now=new Date();
  var thisMonth=now.getFullYear()+'-'+(now.getMonth()+1).toString().padStart(2,'0');
  var thisYear=String(now.getFullYear());
  if(!unpaidMonth)unpaidMonth=thisMonth;if(!unpaidYear)unpaidYear=thisYear;if(!unpaidDate)unpaidDate=today();
  var years=[...new Set(months.map(function(m){return m.slice(0,4);}))].sort().reverse();
  function inRange(d){
    if(!d)return true;if(unpaidView==='all')return true;
    if(unpaidView==='monthly')return d.startsWith(unpaidMonth);
    if(unpaidView==='daily')return d===unpaidDate;
    if(unpaidView==='yearly')return d.startsWith(unpaidYear);
    return true;
  }
  var unpaidPkgs=S.packages.filter(function(p){return !p.isRefund&&(Number(p.unpaidAmount||0)>0||(p.unpaidCollections&&p.unpaidCollections.length>0));});
  var filteredPkgs=unpaidView==='all'?unpaidPkgs:unpaidPkgs.filter(function(p){
    return inRange(p.startDate)||(p.unpaidCollections&&p.unpaidCollections.some(function(c){return inRange(c.date);}));
  });
  var active=filteredPkgs.filter(function(p){return calcRemainingUnpaid(p)>0;});
  var completed=filteredPkgs.filter(function(p){return calcRemainingUnpaid(p)===0;});
  var totalUnpaid=active.reduce(function(s,p){return s+calcRemainingUnpaid(p);},0);
  var totalColl=filteredPkgs.reduce(function(s,p){var cols=(p.unpaidCollections||[]).filter(function(c){return unpaidView==='all'?true:inRange(c.date);});return s+cols.reduce(function(ss,c){return ss+Number(c.amount||0);},0);},0);
  var filterCtrl='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px">'+
  '<div class="filter-tabs" style="margin-bottom:0">'+
  '<button class="filter-tab '+(unpaidView==='all'?'active':'')+'" onclick="unpaidView=\'all\';switchTab(\'unpaid\')">전체</button>'+
  '<button class="filter-tab '+(unpaidView==='monthly'?'active':'')+'" onclick="unpaidView=\'monthly\';switchTab(\'unpaid\')">월별</button>'+
  '<button class="filter-tab '+(unpaidView==='daily'?'active':'')+'" onclick="unpaidView=\'daily\';switchTab(\'unpaid\')">일별</button>'+
  '<button class="filter-tab '+(unpaidView==='yearly'?'active':'')+'" onclick="unpaidView=\'yearly\';switchTab(\'unpaid\')">연도별</button>'+
  '</div>'+
  (unpaidView==='monthly'?'<select onchange="unpaidMonth=this.value;switchTab(\'unpaid\')" style="width:auto">'+months.map(function(m){return '<option value="'+m+'" '+(m===unpaidMonth?'selected':'')+'>'+m+'</option>';}).join('')+'</select>':'')+
  (unpaidView==='daily'?'<input type="date" value="'+unpaidDate+'" onchange="unpaidDate=this.value;switchTab(\'unpaid\')" style="padding:6px 8px;border:1.5px solid var(--border2);border-radius:6px;font-size:13px">':'')+
  (unpaidView==='yearly'?'<select onchange="unpaidYear=this.value;switchTab(\'unpaid\')" style="width:auto">'+years.map(function(y){return '<option value="'+y+'" '+(y===unpaidYear?'selected':'')+'>'+y+'년</option>';}).join('')+'</select>':'')+
  '</div>';
  var activeRows=active.sort(function(a,b){return a.startDate.localeCompare(b.startDate);}).map(function(p){
    var remaining=calcRemainingUnpaid(p);
    var collHtml=(p.unpaidCollections||[]).map(function(c){var pt=PAY_LABEL[c.payType]||c.payType||'';return '<div style="font-size:11px;color:var(--info)">'+c.date+' '+fmt(c.amount)+'원 '+pt+' <span style="color:var(--accent2);font-weight:700">(미수금)</span></div>';}).join('');
    return '<tr><td>'+p.startDate+'</td><td><strong>'+mname(p.memberId)+'</strong></td><td>'+tname(p.trainerId)+'</td>'+
    '<td>'+fmt(p.totalSessions*p.pricePerSession)+'원</td><td>'+fmt(p.paidAmount||0)+'원</td>'+
    '<td><strong style="color:var(--danger);font-size:14px">'+fmt(remaining)+'원</strong></td>'+
    '<td style="min-width:130px">'+(collHtml||'-')+'</td>'+
    '<td><button class="btn btn-sm btn-primary" onclick="collectUnpaid(\''+p.id+'\')">💰 수금처리</button></td></tr>';
  }).join('');
  var compRows=completed.sort(function(a,b){return b.startDate.localeCompare(a.startDate);}).map(function(p){
    var cols=p.unpaidCollections||[];var lastDate=cols.length?cols[cols.length-1].date:'';
    var collHtml=cols.map(function(c){var pt=PAY_LABEL[c.payType]||c.payType||'';return '<div style="font-size:11px;color:var(--info)">'+c.date+' '+fmt(c.amount)+'원 '+pt+' <span style="color:var(--accent2);font-weight:700">(미수금)</span></div>';}).join('');
    return '<tr style="background:var(--green-light)"><td>'+p.startDate+'</td><td><strong>'+mname(p.memberId)+'</strong></td><td>'+tname(p.trainerId)+'</td>'+
    '<td>'+fmt(p.totalSessions*p.pricePerSession)+'원</td><td>'+collHtml+'</td>'+
    '<td style="color:var(--green);font-weight:700">'+lastDate+' ✓</td></tr>';
  }).join('');
  return '<div class="section-header"><div class="section-title">💰 미수금 관리</div></div>'+filterCtrl+
  '<div class="metric-grid" style="margin-bottom:16px">'+
  '<div class="metric" style="border-top-color:var(--danger)"><div class="metric-label">잔여 미수금</div><div class="metric-value" style="color:var(--danger)">'+fmt(totalUnpaid)+'원</div></div>'+
  '<div class="metric" style="border-top-color:var(--green)"><div class="metric-label">수금 완료액</div><div class="metric-value" style="color:var(--green)">'+fmt(totalColl)+'원</div></div>'+
  '<div class="metric" style="border-top-color:var(--accent)"><div class="metric-label">미수 건수</div><div class="metric-value">'+active.length+'건</div></div>'+
  '<div class="metric" style="border-top-color:var(--info)"><div class="metric-label">완납 건수</div><div class="metric-value" style="color:var(--info)">'+completed.length+'건</div></div>'+
  '</div>'+
  '<div style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--danger)">⚠️ 미수금 잔여 ('+active.length+'건)</div>'+
  (active.length===0?'<div class="card"><div class="empty">미수금이 없어요 👍</div></div>':
  '<div class="card" style="overflow-x:auto;margin-bottom:16px"><table class="data-table">'+
  '<thead><tr><th>등록일</th><th>회원</th><th>트레이너</th><th>총금액</th><th>기입금</th><th style="color:var(--danger)">잔여미수금</th><th>수금이력</th><th>수금처리</th></tr></thead>'+
  '<tbody>'+activeRows+'</tbody></table></div>')+
  '<div style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--green)">✅ 수금 완료 ('+completed.length+'건)</div>'+
  (completed.length===0?'<div class="card"><div class="empty" style="color:var(--text3)">완납 내역 없음</div></div>':
  '<div class="card" style="overflow-x:auto"><table class="data-table">'+
  '<thead><tr><th>등록일</th><th>회원</th><th>트레이너</th><th>총금액</th><th>수금이력</th><th>완납일</th></tr></thead>'+
  '<tbody>'+compRows+'</tbody></table></div>');
}

// ── SESSIONS ──
function renderSessions(){
  var isAdmin=CU.role==='admin';var myTid=CU.trainerId||'';
  var months=allMonths();
  var list=S.sessions.filter(function(s){
    if(!isAdmin&&s.trainerId!==myTid)return false;
    return s.type==='use'&&s.date.startsWith(sessMonth);
  }).sort(function(a,b){return b.date.localeCompare(a.date);});

function buildPayrollBody(){
  var isAdmin=CU.role==='admin';var myTid=CU.trainerId||'';
  var trainersToShow=isAdmin?S.trainers:S.trainers.filter(function(t){return t.id===myTid;});
  if(isAdmin&&payTrainerFilter!=='all')trainersToShow=trainersToShow.filter(function(t){return t.id===payTrainerFilter;});
  return payMode==='range'?buildPayrollRange(trainersToShow,isAdmin):buildPayrollMonthly(trainersToShow,isAdmin);
}
function calcTrainerPay(trainerId,monthList){
  var result={sessions:[],totalPay:0,totalQty:0,monthlyData:{}};
  monthList.forEach(function(month){
    var sess=S.sessions.filter(function(s){return s.type==='use'&&s.date.startsWith(month)&&s.trainerId===trainerId;});
    sess.forEach(function(s){
      var pkg=S.packages.filter(function(p){return p.memberId==s.memberId&&!p.isRefund;}).sort(function(a,b){return b.startDate.localeCompare(a.startDate);})[0];
      var priceVat=pkg?pkg.pricePerSession:0;
      var pExVat=pkg?getExVatPrice(priceVat,pkg.payType):0;
      var rt=(pkg&&pkg.regType)||'new';
      var pct=REG_PCT[rt]||45;
      var qty=Number(s.qty||1);
      var pay=Math.round(pExVat*pct/100)*qty;
      result.sessions.push({date:s.date,memberId:s.memberId,priceVat:priceVat,pExVat:pExVat,rt:rt,pct:pct,pay:pay,qty:qty});
      result.totalPay+=pay;result.totalQty+=qty;
      if(!result.monthlyData[month])result.monthlyData[month]={pay:0,qty:0};
      result.monthlyData[month].pay+=pay;result.monthlyData[month].qty+=qty;
    });
  });
  return result;
}
function buildPayrollMonthly(trainersToShow,isAdmin){
  var month=payMonth;
  var totalUse=S.sessions.filter(function(s){return s.type==='use'&&s.date.startsWith(month);}).reduce(function(s,x){return s+Number(x.qty||1);},0);
  var totalPay=0;
  var cards=trainersToShow.map(function(t){
    var td=calcTrainerPay(t.id,[month]);
    var base=t.base||0;totalPay+=td.totalPay+base;
    return buildTrainerCard(t,td,month,month);
  }).join('');
  var metrics=isAdmin?'<div class="metric-grid" style="margin-bottom:12px">'+
  '<div class="metric"><div class="metric-label">총 수업</div><div class="metric-value">'+totalUse+'회</div></div>'+
  '<div class="metric"><div class="metric-label">총 지급 예정</div><div class="metric-value">'+fmt(totalPay)+'원</div></div>'+

  '</div>':'';
  return metrics+cards;
}

function buildStatementHTML(trainerId,month){

  var sessions=S.sessions.filter(function(s){return s.type==='use'&&s.date.startsWith(month)&&s.trainerId===trainerId;});
  var totalQty=sessions.reduce(function(s,x){return s+Number(x.qty||1);},0);
  var incentive=sessions.reduce(function(s,x){
    var pkg=S.packages.filter(function(p){return p.memberId==x.memberId&&!p.isRefund;}).sort(function(a,b){return b.startDate.localeCompare(a.startDate);})[0];
    var pExVat=pkg?getExVatPrice(pkg.pricePerSession,pkg.payType):0;
    var pct=REG_PCT[(pkg&&pkg.regType)||'new']||45;
    return s+Math.round(pExVat*pct/100)*Number(x.qty||1);
  },0);
  var base=t.base||0;var totalService=base+incentive;
  var incomeTax=Math.round(totalService*0.03);var localTax=Math.round(totalService*0.003);var finalPay=totalService-incomeTax-localTax;

    var pExVat=pkg?getExVatPrice(pkg.pricePerSession,pkg.payType):0;
    var rt=(pkg&&pkg.regType)||'new';var pct=REG_PCT[rt]||45;var qty=Number(s.qty||1);var pay=Math.round(pExVat*pct/100)*qty;
    return '<tr><td>'+s.date.slice(0,7)+'</td><td>'+mname(s.memberId)+'</td><td>'+qty+'회</td><td>'+REG_LABEL[rt]+'</td><td>'+fmt(pExVat)+'원</td><td>'+pct+'%</td><td>'+fmt(pay)+'원</td></tr>';

  '<tr><td class="stmt-label">PT 전체 매출 금액</td><td class="stmt-currency">₩</td><td class="stmt-amount">-</td></tr>'+
  '<tr><td class="stmt-label">수업 정산금</td><td class="stmt-currency">₩</td><td class="stmt-amount">'+fmt(incentive)+'</td></tr>'+
  '<tr><td class="stmt-label">고정 정산금</td><td class="stmt-currency">₩</td><td class="stmt-amount">'+(base>0?fmt(base):'-')+'</td></tr>'+
  '<tr><td class="stmt-label">성과 정산금</td><td class="stmt-currency">₩</td><td class="stmt-amount">-</td></tr>'+
  '<tr><td class="stmt-label">계약 지원금</td><td class="stmt-currency">₩</td><td class="stmt-amount">-</td></tr>'+
  '<tr class="stmt-subtotal"><td class="stmt-label"><strong>용역대가 합계</strong></td><td class="stmt-currency">₩</td><td class="stmt-amount"><strong>'+fmt(totalService)+'</strong></td></tr>'+
  '<tr><td class="stmt-label">소득세 (3%)</td><td class="stmt-currency">₩</td><td class="stmt-amount">'+fmt(incomeTax)+'</td></tr>'+
  '<tr><td class="stmt-label">지방소득세 (0.3%)</td><td class="stmt-currency">₩</td><td class="stmt-amount">'+fmt(localTax)+'</td></tr>'+
  '<tr class="stmt-final"><td class="stmt-label"><strong>지급 금액</strong></td><td class="stmt-currency">₩</td><td class="stmt-amount"><strong>'+fmt(finalPay)+'</strong></td></tr>'+
  '</tbody></table>'+
  (detailRows?'<div class="stmt-detail"><div class="stmt-detail-title">수업 상세 내역 ('+totalQty+'회)</div>'+
  '<table class="stmt-detail-table"><thead><tr><th>월</th><th>회원</th><th>횟수</th><th>유형</th><th>단가(VAT제외)</th><th>비율</th><th>수령액</th></tr></thead>'+

function copyStatementText(trainerId,month){
  var t=S.trainers.find(function(x){return x.id===trainerId;});if(!t){alert('트레이너 정보 없음');return;}
  var sessions=S.sessions.filter(function(s){return s.type==='use'&&s.date.startsWith(month)&&s.trainerId===trainerId;});
  var totalQty=sessions.reduce(function(s,x){return s+Number(x.qty||1);},0);
  var incentive=sessions.reduce(function(s,x){
    var pkg=S.packages.filter(function(p){return p.memberId==x.memberId&&!p.isRefund;}).sort(function(a,b){return b.startDate.localeCompare(a.startDate);})[0];
    var pExVat=pkg?getExVatPrice(pkg.pricePerSession,pkg.payType):0;
    var pct=REG_PCT[(pkg&&pkg.regType)||'new']||45;
    return s+Math.round(pExVat*pct/100)*Number(x.qty||1);
  },0);
  var base=t.base||0;var totalService=base+incentive;
  var incomeTax=Math.round(totalService*0.03);var localTax=Math.round(totalService*0.003);var finalPay=totalService-incomeTax-localTax;
  var ym=month.split('-');var ml=ym[0]+'년 '+parseInt(ym[1])+'월';
  var line='────────────────────────────────';
  var txt=ml+' 용역비 정산서\n'+line+'\n담당자: '+t.name+'\n'+line+'\n'+
  'PT 전체 매출 금액       ₩  -\n수업 정산금             ₩  '+fmt(incentive)+'\n고정 정산금             ₩  '+(base>0?fmt(base):'-')+'\n'+
  '성과 정산금             ₩  -\n계약 지원금             ₩  -\n'+line+'\n용역대가 합계           ₩  '+fmt(totalService)+'\n소득세(3%)              ₩  '+fmt(incomeTax)+'\n지방소득세(0.3%)        ₩  '+fmt(localTax)+'\n'+line+'\n지급 금액               ₩  '+fmt(finalPay)+'\n'+line+'\n\n[수업 상세 - '+totalQty+'회]\n';
  sessions.forEach(function(s){
    var pkg=S.packages.filter(function(p){return p.memberId==s.memberId&&!p.isRefund;}).sort(function(a,b){return b.startDate.localeCompare(a.startDate);})[0];
    var pExVat=pkg?getExVatPrice(pkg.pricePerSession,pkg.payType):0;
    var rt=(pkg&&pkg.regType)||'new';var pct=REG_PCT[rt]||45;var qty=Number(s.qty||1);var pay=Math.round(pExVat*pct/100)*qty;
    txt+='  '+s.date.slice(0,7)+' | '+mname(s.memberId)+' | '+qty+'회 | '+REG_LABEL[rt]+' | '+fmt(pExVat)+'원×'+pct+'% = '+fmt(pay)+'원\n';
  });
  try{navigator.clipboard.writeText(txt).then(function(){alert('✅ '+t.name+' 정산서가 복사됐어요!');});}
  catch(e){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('✅ 정산서가 복사됐어요!');}
}
function copyAllStatements(month){S.trainers.forEach(function(t){copyStatementText(t.id,month);});}

function importExcel(e){
  var file=e.target.files[0];if(!file)return;
  var script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  script.onload=function(){
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var wb=XLSX.read(ev.target.result,{type:'binary'});
        var result={members:[],packages:[],sessions:[],trainers:[]};
        // 회원목록 시트
        if(wb.SheetNames.indexOf('회원목록')>=0){
          var ws=wb.Sheets['회원목록'];
          var rows=XLSX.utils.sheet_to_json(ws);
          rows.forEach(function(r){
            if(!r['이름'])return;
            result.members.push({
              id:uid(),name:r['이름']||'',phone:r['연락처']||'',
              regdate:r['등록일']||'',memo:r['메모']||''
            });
          });
        }
        // 매출현황 시트
        if(wb.SheetNames.indexOf('매출현황')>=0){
          var ws2=wb.Sheets['매출현황'];
          var rows2=XLSX.utils.sheet_to_json(ws2);
          rows2.forEach(function(r){
            if(!r['회원']||!r['등록일'])return;
            var m=result.members.find(function(x){return x.name===r['회원'];});
            var t=S.trainers.find(function(x){return x.name===r['트레이너'];});
            var payTypeMap={'카드':'card','현금':'cash','현금영수증':'cashreceipt','환불':'refund'};
            var isRefund=r['환불여부']==='환불';
            result.packages.push({
              id:uid(),
              memberId:m?m.id:'',
              trainerId:t?t.id:'',
              regType:r['유형']&&r['유형'].includes('재등록')?'re':r['유형']&&r['유형'].includes('소개')?'intro':'new',
              totalSessions:Number(r['횟수'])||0,
              pricePerSession:Number(r['단가'])||0,
              startDate:String(r['등록일']||'').slice(0,10),
              payType:payTypeMap[r['결제수단']]||'card',
              paidAmount:Number(r['입금액'])||0,
              originalPaid:Number(r['입금액'])||0,
              unpaidAmount:Number(r['미수금'])||0,
              isRefund:isRefund,
              unpaidCollections:[],
              memo:''
            });
            // 횟수권이면 add 세션도 추가
            if(!isRefund&&Number(r['횟수'])>0){
              result.sessions.push({
                id:uid(),type:'add',
                memberId:m?m.id:'',
                trainerId:t?t.id:'',
                date:String(r['등록일']||'').slice(0,10),
                qty:Number(r['횟수'])||0,
                memo:'엑셀 가져오기'
              });
            }
          });
        }
        if(!result.members.length&&!result.packages.length){
          alert('⚠️ 가져올 데이터가 없어요!\n\n엑셀 파일에 "회원목록" 또는 "매출현황" 시트가 있어야 해요.\n\n먼저 📊 엑셀 백업으로 양식을 받아보세요!');
          return;
        }
        if(!confirm('엑셀에서 데이터를 가져올까요?\n\n회원: '+result.members.length+'명\n결제: '+result.packages.length+'건\n\n⚠️ 기존 데이터에 추가됩니다.'))return;
        // 기존 데이터에 추가 (덮어쓰기 아님)
        result.members.forEach(function(m){S.members.push(m);});
        result.packages.forEach(function(p){S.packages.push(p);});
        result.sessions.forEach(function(s){S.sessions.push(s);});
        saveState();
        alert('✅ 가져오기 완료!\n\n회원 '+result.members.length+'명, 결제 '+result.packages.length+'건 추가됐어요!');
        switchTab('settings');
      }catch(err){alert('파일 오류: '+err.message);}
    };
    reader.readAsBinaryString(file);
  };
  document.head.appendChild(script);
  e.target.value='';
}
function importData(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      if(!confirm('데이터를 불러올까요?\n\n현재 데이터가 모두 덮어씌워집니다.'))return;
      if(data.members)S.members=data.members;if(data.packages)S.packages=data.packages;
      if(data.sessions)S.sessions=data.sessions;if(data.trainers)S.trainers=data.trainers;
      if(data.lockers)S.lockers=data.lockers;if(data.accounts)S.accounts=data.accounts;
      if(data.deletedLog)S.deletedLog=data.deletedLog;
      saveState();alert('✅ 복원 완료!');switchTab('settings');
    }catch(err){alert('파일 오류: '+err.message);}
  };
  reader.readAsText(file);e.target.value='';
}
function exportExcel(){
  var script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  script.onload=function(){
    var wb=XLSX.utils.book_new();
    var memberRows=S.members.map(function(m){return {이름:m.name,연락처:m.phone||'',등록일:m.regdate||'',잔여횟수:getMemberBalance(m.id),미수금:getMemberUnpaid(m.id)};});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(memberRows),'회원목록');
    var pkgRows=S.packages.map(function(p){return {등록일:p.startDate,회원:mname(p.memberId),트레이너:tname(p.trainerId),유형:REG_LABEL[p.regType||'new'],횟수:p.totalSessions||0,단가:p.pricePerSession,결제수단:PAY_LABEL[p.payType]||p.payType,입금액:p.paidAmount||0,미수금:p.unpaidAmount||0,환불여부:p.isRefund?'환불':'정상'};});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pkgRows),'매출현황');
    XLSX.writeFile(wb,'잘나가짐_백업_'+today()+'.xlsx');
  };
  document.head.appendChild(script);
}
